<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mercado em Jogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#14213d;--card:#1f2f52;--line:#34446a;--ink:#f6f4ef;--mute:#aab3c5;--or:#e07a2c;--or2:#f0a35e;--blue:#5b9be0;--bad:#ff8a80;--good:#7fd6a4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--navy);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;margin:0;line-height:1.1}
p{margin:0;line-height:1.45}
#app{max-width:1280px;margin:0 auto;padding:24px 20px 48px}
.kick{font-size:13px;letter-spacing:2px;font-weight:700;color:var(--or2);text-transform:uppercase}
.card{background:var(--card);border-radius:16px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.grow{flex:1;min-width:260px}
.btn{appearance:none;border:0;border-radius:12px;padding:14px 20px;font:600 17px Inter,sans-serif;cursor:pointer;background:var(--or);color:#14213d}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.big{font-size:20px;padding:18px 28px}
input[type=text],input[type=number]{width:100%;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:#0f1a31;color:var(--ink);font:600 20px Inter,sans-serif}
input:focus{outline:none;border-color:var(--or2)}
input[type=range]{width:100%;accent-color:var(--or)}
.mute{color:var(--mute)}
.big-num{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:40px}
.good{color:var(--good)} .bad{color:var(--bad)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border:2px solid var(--line);border-radius:12px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--or);width:20px;height:20px}
.opt.sel{border-color:var(--or2);background:#26365c}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.kpi{background:#0f1a31;border-radius:12px;padding:12px}
.kpi b{display:block;font-size:22px;margin-top:4px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:18px}
th{color:var(--mute);font-size:14px;letter-spacing:1px;text-transform:uppercase}
td.n,th.n{text-align:right}
.timer{height:10px;background:#0f1a31;border-radius:6px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--or);transition:width .25s linear}
.chip{display:inline-block;padding:6px 12px;border-radius:999px;background:#0f1a31;margin:4px;font-size:16px}
.chip.ok{background:#2c5a3f}
#qr{background:#fff;padding:14px;border-radius:12px;display:inline-block}
#qr img,#qr canvas{display:block}
.link{word-break:break-all;font-size:15px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:24px}
.step{width:220px;border-radius:16px 16px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px 10px;text-align:center;animation:rise .9s ease-out both}
.step .pos{font-family:"Space Grotesk";font-size:56px;font-weight:700}
.step .nm{font-size:22px;font-weight:700;margin-top:6px;word-break:break-word}
.step .val{font-size:18px;margin-top:6px}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.host h1{font-size:56px}
.host .scen{font-size:26px}
.note{font-size:14px;color:var(--mute)}
.warn{background:#4a2a12;border-radius:12px;padding:12px 16px;color:#ffd7b3}
@media (max-width:640px){.host h1{font-size:36px}.big-num{font-size:32px}th,td{font-size:15px;padding:8px}}
</style>
</head>
<body>
<div id="app"><p class="mute">Carregando…</p></div>

<script>
/* ===== Regras do jogo (ajuste aqui se quiser) ===== */
const CFG = {
  rounds: 5,          // número de rodadas
  secs: 75,           // segundos por rodada
  fixed: 10000,       // custos fixos por rodada (R$)
  varPct: 0.18,       // tributos (10%) + despesas variáveis (8%) sobre o preço
  pref: 1500,         // preço de referência do mercado (R$)
  perPlayer: 80       // tamanho do mercado: sensores por empresa por rodada
};
// beta = sensibilidade a preço (elasticidade); val = peso do valor demonstrado;
// out = força da alternativa do cliente (não comprar / importado); dem = tamanho do mercado
const SCEN = [
  {t:"Mercado normal", d:"Clientes comparam preço e valor de forma equilibrada. Defina seu preço inicial.", cv:800, beta:4, val:1, out:0.5, dem:1},
  {t:"O aço subiu", d:"Seu custo variável passou de R$ 800 para R$ 920 por sensor. Repassar ao preço ou absorver na margem?", cv:920, beta:4, val:1, out:0.5, dem:1},
  {t:"Chegou um importado barato", d:"Um concorrente estrangeiro entrou vendendo barato. Os clientes ficaram mais sensíveis a preço e o valor pesa menos.", cv:920, beta:6, val:0.6, out:1.1, dem:1},
  {t:"Cliente técnico exige TCO", d:"Grandes indústrias querem estudo de custo total. Valor demonstrado pesa muito mais que preço nesta rodada.", cv:850, beta:2.5, val:1.8, out:0.5, dem:1},
  {t:"Juros altos", d:"Crédito caro: muitos clientes adiaram compras e o mercado encolheu 30%. Cuidado com os custos fixos.", cv:850, beta:5, val:1, out:0.5, dem:0.7}
];
const ES = [
  {n:"Sem ação comercial", s:"Só envia a tabela de preços.", c:0, v:0},
  {n:"Visita técnica", s:"Engenheiro visita o cliente e configura a solução.", c:2000, v:0.25},
  {n:"Estudo de TCO + demonstração", s:"Prova economia e payback para o cliente.", c:5000, v:0.6}
];

/* ===== Utilitários ===== */
const app = document.getElementById('app');
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => (n < 0 ? '−' : '') + 'R$ ' + Math.abs(Math.round(n)).toLocaleString('pt-BR');
const brl2 = n => (n < 0 ? '−' : '') + 'R$ ' + Math.abs(n).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const cls = n => n < 0 ? 'bad' : 'good';
const rnd = n => Math.random().toString(36).slice(2, 2 + n);
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const baseUrl = () => location.origin + location.pathname;
const piso = cv => cv / (1 - CFG.varPct);

/* ===== Modelo de mercado ===== */
function market(decs, sc){
  const N = decs.length;
  const M = CFG.perPlayer * N * sc.dem;
  const A = decs.map(p => (1 + ES[p.es].v * sc.val) * Math.exp(-sc.beta * (p.price - CFG.pref) / CFG.pref));
  const sum = A.reduce((a, b) => a + b, 0) + sc.out * N;
  return decs.map((p, i) => {
    const q = Math.round(M * A[i] / sum);
    const mcu = p.price * (1 - CFG.varPct) - sc.cv;
    const lucro = q * mcu - CFG.fixed - ES[p.es].c;
    return {pid:p.pid, price:p.price, es:p.es, auto:!!p.auto, q, mcu, rev:q * p.price, mc:q * mcu, lucro, share:A[i] / sum};
  });
}
function tip(r, cv){
  if (r.mcu <= 0) return "Preço abaixo do piso: cada sensor vendido aumentou o prejuízo.";
  if (r.lucro < 0 && r.price > CFG.pref * 1.15) return "Preço alto afastou clientes: o volume não cobriu os custos fixos.";
  if (r.lucro < 0) return "A margem de contribuição total não cobriu os custos fixos e a ação comercial.";
  if (r.mcu / r.price < 0.25) return "Lucro positivo, mas com margem apertada: pouco espaço para imprevistos.";
  return "Boa! Margem e volume cobriram os custos fixos e geraram lucro.";
}

/* ===== Carregar PeerJS e QR (com alternativa) ===== */
function loadScript(src){return new Promise((ok, no) => {const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s);});}
async function loadLibs(){
  if (!window.Peer){
    for (const u of ["https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js","https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"]){
      try { await loadScript(u); if (window.Peer) break; } catch(e){}
    }
  }
  if (!window.QRCode){
    for (const u of ["https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js","https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"]){
      try { await loadScript(u); if (window.QRCode) break; } catch(e){}
    }
  }
}

/* ===================================================== */
/* ===================  APRESENTADOR  ================== */
/* ===================================================== */
const H = {code:null, peer:null, players:{}, round:-1, phase:'lobby', timer:null, endsAt:0, results:[]};

function hostPlayers(){ return Object.values(H.players); }
function ranking(){ return hostPlayers().slice().sort((a, b) => b.total - a.total); }
function sendTo(p, msg){ if (p.conn && p.conn.open){ try { p.conn.send(msg); } catch(e){} } }

function startHost(){
  if (!window.Peer){ app.innerHTML = `<div class="card stack"><h2>Não foi possível carregar a conexão</h2><p class="mute">Verifique a internet do computador e recarregue a página.</p></div>`; return; }
  H.code = rnd(4).toUpperCase().replace(/[^A-Z0-9]/g, 'X');
  app.innerHTML = `<div class="card"><p>Abrindo a sala…</p></div>`;
  try { H.peer = new Peer('mercado-jogo-' + H.code.toLowerCase()); }
  catch(e){ blockedMsg(); return; }
  const myPeer = H.peer;
  setTimeout(() => { if (H.peer === myPeer && !myPeer.open && H.phase === 'lobby') blockedMsg(); }, 12000);
  H.peer.on('open', () => renderLobby());
  H.peer.on('connection', conn => {
    conn.on('data', d => hostData(conn, d));
    conn.on('close', () => { const p = H.players[conn._pid]; if (p && p.conn === conn){ p.online = false; refreshHost(); } });
  });
  H.peer.on('disconnected', () => { try { H.peer.reconnect(); } catch(e){} });
  H.peer.on('error', e => {
    if (e.type === 'unavailable-id'){ H.peer.destroy(); startHost(); return; }
    if (H.phase === 'lobby' && !H.peer.open) app.innerHTML = `<div class="card stack"><h2>Erro ao abrir a sala</h2><p class="mute">${esc(e.type)}. Verifique a internet e recarregue.</p></div>`;
  });
}

function blockedMsg(){
  app.innerHTML = `<div class="card stack" style="max-width:640px;margin:40px auto">
    <h2>Não consegui abrir a sala</h2>
    <p>Este navegador ou esta rede bloqueou a conexão do jogo. Isso acontece quando o arquivo é aberto numa pré-visualização (como a do app do Claude ou de um app de arquivos) ou numa rede que bloqueia conexões diretas.</p>
    <p class="mute">Publique o arquivo (GitHub Pages ou Netlify) e abra o endereço no Chrome, Edge ou Safari. Se a rede da faculdade bloquear, teste pelo 4G.</p>
    <button class="btn" onclick="location.reload()">Tentar de novo</button></div>`;
}

function hostData(conn, d){
  if (!d || typeof d !== 'object') return;
  if (d.type === 'join'){
    const pid = String(d.pid || '').slice(0, 40); if (!pid) return;
    let p = H.players[pid];
    if (!p){
      if (H.phase === 'final') { try { conn.send({type:'closed'}); } catch(e){} return; }
      const name = String(d.name || '').trim().slice(0, 24) || 'Empresa';
      p = H.players[pid] = {pid, name, total:0, last:{price:CFG.pref, es:0}, dec:null, hist:[]};
    }
    p.conn = conn; p.online = true; conn._pid = pid;
    sendTo(p, {type:'welcome', name:p.name, rounds:CFG.rounds});
    syncPlayer(p); refreshHost();
  } else if (d.type === 'decision'){
    const p = H.players[conn._pid];
    if (!p || H.phase !== 'round' || d.round !== H.round) return;
    let price = Number(d.price); if (!isFinite(price)) return;
    price = Math.min(4000, Math.max(500, Math.round(price)));
    const es = [0, 1, 2].includes(d.es) ? d.es : 0;
    p.dec = {price, es};
    sendTo(p, {type:'ack', price, es});
    refreshHost();
    if (hostPlayers().every(x => x.dec)) endRound();
  }
}

function syncPlayer(p){
  if (H.phase === 'lobby') sendTo(p, {type:'lobby'});
  else if (H.phase === 'round'){
    const secs = Math.max(0, Math.round((H.endsAt - Date.now()) / 1000));
    sendTo(p, {type:'round', round:H.round, secs, last:p.last, done:p.dec});
  } else if (H.phase === 'results'){
    const r = H.results.find(x => x.pid === p.pid);
    const rk = ranking(); const pos = rk.indexOf(p) + 1;
    if (r) sendTo(p, {type:'result', round:H.round, r, pos, n:rk.length, total:p.total, last:H.round === CFG.rounds - 1});
    else sendTo(p, {type:'lobby'});
  } else if (H.phase === 'final'){
    const rk = ranking(); const pos = rk.indexOf(p) + 1;
    sendTo(p, {type:'final', pos, n:rk.length, total:p.total, podium:rk.slice(0, 3).map(x => ({name:x.name, total:x.total}))});
  }
}

function addBots(){
  ['Robô Alfa', 'Robô Beta', 'Robô Gama'].forEach(n => {
    const pid = 'bot-' + rnd(6);
    H.players[pid] = {pid, name:n, bot:true, online:true, total:0, last:{price:CFG.pref, es:0}, dec:null, hist:[]};
  });
  refreshHost();
}

function startRound(){
  if (!hostPlayers().length) return;
  H.round++; H.phase = 'round';
  hostPlayers().forEach(p => {
    p.dec = null;
    if (p.bot){ const sc = SCEN[H.round]; p.dec = {price:Math.round((piso(sc.cv) * 1.25 + Math.random() * 700) / 10) * 10, es:Math.floor(Math.random() * 3)}; }
  });
  H.endsAt = Date.now() + CFG.secs * 1000;
  hostPlayers().forEach(syncPlayer);
  renderHostRound();
  clearInterval(H.timer);
  H.timer = setInterval(() => { if (Date.now() >= H.endsAt) endRound(); else updateHostTimer(); }, 250);
}

function endRound(){
  if (H.phase !== 'round') return;
  clearInterval(H.timer);
  const list = hostPlayers();
  const decs = list.map(p => { const d = p.dec || p.last; p.last = {price:d.price, es:d.es}; return {pid:p.pid, price:d.price, es:d.es, auto:!p.dec}; });
  H.results = market(decs, SCEN[H.round]);
  H.results.forEach(r => { const p = H.players[r.pid]; p.total += r.lucro; p.hist.push(r); });
  H.phase = 'results';
  list.forEach(syncPlayer);
  renderHostResults();
}

function showPodium(){ H.phase = 'final'; hostPlayers().forEach(syncPlayer); renderPodium(); }

function resetGame(){
  H.round = -1; H.phase = 'lobby'; H.results = [];
  hostPlayers().forEach(p => { if (p.bot) delete H.players[p.pid]; else { p.total = 0; p.hist = []; p.dec = null; p.last = {price:CFG.pref, es:0}; } });
  hostPlayers().forEach(syncPlayer); renderLobby();
}

function refreshHost(){
  if (H.phase === 'lobby') renderLobby();
  else if (H.phase === 'round') renderHostStatus();
}

/* ----- Telas do apresentador ----- */
function renderLobby(){
  const link = baseUrl() + '?sala=' + H.code;
  const ps = hostPlayers();
  const local = location.protocol === 'file:';
  app.innerHTML = `
  <div class="host stack">
    <p class="kick">Mercado em Jogo · Sala ${esc(H.code)}</p>
    <h1>Sua empresa vende sensores industriais. Quem lucra mais?</h1>
    ${local ? `<p class="warn">Você abriu o arquivo direto do computador. Para os celulares entrarem, publique o arquivo na internet (veja as instruções) e abra a sala pelo endereço publicado.</p>` : ''}
    <div class="row">
      <div class="card stack" style="align-items:center;min-width:300px">
        <div id="qr"></div>
        <p class="link mute">${esc(link)}</p>
        <p>Código da sala: <b style="font-size:28px;letter-spacing:3px">${esc(H.code)}</b></p>
      </div>
      <div class="card stack grow">
        <h3>Como funciona</h3>
        <p class="scen">${CFG.rounds} rodadas de ${CFG.secs} s. Em cada uma você define o <b>preço do sensor</b> e a <b>ação de engenharia de vendas</b>.</p>
        <p class="mute">Preço baixo conquista clientes mas pode ficar abaixo do piso. Preço alto dá margem mas afasta clientes. Mostrar valor ao cliente custa dinheiro, mas reduz a sensibilidade a preço. Vence o maior lucro acumulado.</p>
        <h3 style="margin-top:8px">Empresas conectadas (${ps.length})</h3>
        <div>${ps.map(p => `<span class="chip ${p.online ? 'ok' : ''}">${esc(p.name)}</span>`).join('') || '<span class="mute">Aguardando jogadores…</span>'}</div>
        <div class="row">
          <button class="btn big" id="go" ${ps.length ? '' : 'disabled'}>Começar jogo</button>
          <button class="btn ghost" id="bots">Adicionar 3 robôs (teste)</button>
        </div>
      </div>
    </div>
  </div>`;
  $('go').onclick = startRound;
  $('bots').onclick = addBots;
  const q = $('qr');
  if (window.QRCode){ try { new QRCode(q, {text:link, width:260, height:260, correctLevel:QRCode.CorrectLevel.M}); } catch(e){ q.style.display = 'none'; } }
  else q.style.display = 'none';
}

function renderHostRound(){
  const sc = SCEN[H.round];
  app.innerHTML = `
  <div class="host stack">
    <p class="kick">Rodada ${H.round + 1} de ${CFG.rounds}</p>
    <h1>${esc(sc.t)}</h1>
    <p class="scen">${esc(sc.d)}</p>
    <div class="timer"><i id="tbar" style="width:100%"></i></div>
    <div class="row">
      <div class="card grow stack">
        <h3>Dados da rodada</h3>
        <div class="kpis">
          <div class="kpi"><span class="mute">Custo variável</span><b>${brl(sc.cv)} / sensor</b></div>
          <div class="kpi"><span class="mute">Tributos + desp. variáveis</span><b>${Math.round(CFG.varPct * 100)}% do preço</b></div>
          <div class="kpi"><span class="mute">Custos fixos</span><b>${brl(CFG.fixed)}</b></div>
          <div class="kpi"><span class="mute">Preço de referência</span><b>${brl(CFG.pref)}</b></div>
        </div>
      </div>
      <div class="card grow stack">
        <div class="row" style="justify-content:space-between;align-items:center"><h3>Decisões enviadas</h3><span class="big-num" id="tleft"></span></div>
        <div id="status"></div>
        <button class="btn ghost" id="end">Encerrar rodada agora</button>
      </div>
    </div>
  </div>`;
  $('end').onclick = endRound;
  renderHostStatus(); updateHostTimer();
}
function renderHostStatus(){
  const el = $('status'); if (!el) return;
  const ps = hostPlayers(); const n = ps.filter(p => p.dec).length;
  el.innerHTML = `<p class="mute" style="margin-bottom:8px">${n} de ${ps.length}</p>` + ps.map(p => `<span class="chip ${p.dec ? 'ok' : ''}">${p.dec ? '✓ ' : ''}${esc(p.name)}</span>`).join('');
}
function updateHostTimer(){
  const left = Math.max(0, H.endsAt - Date.now());
  const b = $('tbar'), t = $('tleft');
  if (b) b.style.width = (100 * left / (CFG.secs * 1000)) + '%';
  if (t) t.textContent = Math.ceil(left / 1000) + 's';
}

function renderHostResults(){
  const sc = SCEN[H.round];
  const rk = ranking();
  const byPid = Object.fromEntries(H.results.map(r => [r.pid, r]));
  const best = H.results.slice().sort((a, b) => b.lucro - a.lucro)[0];
  const avgP = H.results.reduce((a, r) => a + r.price, 0) / H.results.length;
  const sold = H.results.reduce((a, r) => a + r.q, 0);
  const lastR = H.round === CFG.rounds - 1;
  app.innerHTML = `
  <div class="host stack">
    <p class="kick">Resultado · Rodada ${H.round + 1} de ${CFG.rounds} · ${esc(sc.t)}</p>
    <h1>Melhor da rodada: ${esc(H.players[best.pid].name)} (${brl(best.lucro)})</h1>
    <div class="row">
      <div class="kpi grow"><span class="mute">Preço médio</span><b>${brl(avgP)}</b></div>
      <div class="kpi grow"><span class="mute">Sensores vendidos no mercado</span><b>${sold}</b></div>
      <div class="kpi grow"><span class="mute">Piso desta rodada (MC = 0)</span><b>${brl2(piso(sc.cv))}</b></div>
    </div>
    <div class="card" style="overflow-x:auto">
      <table>
        <tr><th>#</th><th>Empresa</th><th class="n">Preço</th><th>Ação comercial</th><th class="n">Clientes</th><th class="n">MC / un.</th><th class="n">Lucro rodada</th><th class="n">Acumulado</th></tr>
        ${rk.map((p, i) => { const r = byPid[p.pid]; return `<tr>
          <td>${i + 1}</td><td><b>${esc(p.name)}</b>${r.auto ? ' <span class="note">(sem resposta)</span>' : ''}</td>
          <td class="n">${brl(r.price)}</td><td>${esc(ES[r.es].n)}</td><td class="n">${r.q}</td>
          <td class="n ${cls(r.mcu)}">${brl(r.mcu)}</td><td class="n ${cls(r.lucro)}">${brl(r.lucro)}</td><td class="n ${cls(p.total)}"><b>${brl(p.total)}</b></td></tr>`; }).join('')}
      </table>
    </div>
    <div class="row">
      ${lastR ? `<button class="btn big" id="next">Ver o pódio 🏆</button>` : `<button class="btn big" id="next">Próxima rodada</button>`}
    </div>
  </div>`;
  $('next').onclick = lastR ? showPodium : startRound;
}

function renderPodium(){
  const rk = ranking();
  const col = [{bg:'#c0c7d4', fg:'#14213d', h:230, i:1}, {bg:'#f0a35e', fg:'#14213d', h:300, i:0}, {bg:'#b07a4f', fg:'#14213d', h:180, i:2}];
  app.innerHTML = `
  <div class="host stack" style="text-align:center">
    <p class="kick">Pódio final</p>
    <h1>Quem equilibrou melhor preço, valor e margem</h1>
    <div class="podium">
      ${col.map((c, k) => { const p = rk[c.i]; if (!p) return ''; return `<div class="step" style="background:${c.bg};color:${c.fg};height:${c.h}px;animation-delay:${[0.6, 1.2, 0][k]}s">
        <div class="pos">${c.i + 1}º</div><div class="nm">${esc(p.name)}</div><div class="val">${brl(p.total)}</div></div>`; }).join('')}
    </div>
    <div class="card" style="text-align:left;overflow-x:auto">
      <table><tr><th>#</th><th>Empresa</th><th class="n">Lucro acumulado</th><th class="n">Preço médio</th></tr>
      ${rk.map((p, i) => `<tr><td>${i + 1}</td><td>${esc(p.name)}</td><td class="n ${cls(p.total)}"><b>${brl(p.total)}</b></td><td class="n">${brl(p.hist.reduce((a, r) => a + r.price, 0) / Math.max(1, p.hist.length))}</td></tr>`).join('')}
      </table>
    </div>
    <div><button class="btn ghost" id="again">Jogar de novo</button></div>
  </div>`;
  $('again').onclick = resetGame;
}

/* ===================================================== */
/* =====================  JOGADOR  ===================== */
/* ===================================================== */
const P = {code:null, pid:null, name:'', peer:null, conn:null, tick:null, round:-1, tries:0};

function startPlayer(code){
  P.code = code.toUpperCase();
  P.pid = store.get('mj_pid') || ('p-' + rnd(10)); store.set('mj_pid', P.pid);
  const saved = store.get('mj_name') || '';
  app.innerHTML = `
  <div class="stack" style="max-width:520px;margin:0 auto">
    <p class="kick">Mercado em Jogo · Sala ${esc(P.code)}</p>
    <h2 style="font-size:32px">Dê um nome à sua empresa</h2>
    <form id="f" class="stack">
      <input type="text" id="nm" maxlength="24" placeholder="Ex.: Sensores do João" value="${esc(saved)}" autocomplete="off">
      <button class="btn big" type="submit">Entrar no jogo</button>
    </form>
    <p class="mute">Você vai decidir preço e ação comercial em ${CFG.rounds} rodadas. Vence quem tiver o maior lucro acumulado.</p>
  </div>`;
  $('f').onsubmit = e => {
    e.preventDefault();
    const n = $('nm').value.trim(); if (!n) { $('nm').focus(); return; }
    P.name = n.slice(0, 24); store.set('mj_name', P.name);
    playerWait('Conectando à sala…'); connect();
  };
}

function connect(){
  if (!window.Peer){ playerWait('Não foi possível carregar a conexão. Verifique a internet e recarregue a página.'); return; }
  try { if (P.peer) P.peer.destroy(); } catch(e){}
  try { P.peer = new Peer(); } catch(e){ blockedMsg(); return; }
  P.peer.on('open', () => {
    const c = P.peer.connect('mercado-jogo-' + P.code.toLowerCase(), {reliable:true});
    P.conn = c;
    c.on('open', () => { P.tries = 0; c.send({type:'join', pid:P.pid, name:P.name}); });
    c.on('data', playerData);
    c.on('close', () => { if (P.conn === c) retry(); });
  });
  P.peer.on('error', e => {
    if (e.type === 'peer-unavailable') { playerWait('Sala não encontrada. Confira o código ou peça para o apresentador abrir a sala. Tentando de novo…'); setTimeout(connect, 4000); }
    else retry();
  });
}
function retry(){
  P.tries++;
  playerWait('Conexão perdida. Reconectando…');
  setTimeout(connect, Math.min(8000, 1500 * P.tries));
}

function playerData(d){
  if (!d || typeof d !== 'object') return;
  if (d.type === 'welcome' || d.type === 'lobby') playerWait(`<b>${esc(P.name)}</b> está no jogo! Aguarde o apresentador começar a rodada.`);
  else if (d.type === 'round'){ P.round = d.round; if (d.done) playerSent(d.done); else renderDecide(d.round, d.secs, d.last); }
  else if (d.type === 'ack') playerSent(d);
  else if (d.type === 'result') renderResult(d);
  else if (d.type === 'final') renderFinal(d);
  else if (d.type === 'closed') playerWait('Este jogo já terminou. Aguarde o apresentador iniciar um novo.');
}

function playerWait(html){
  clearInterval(P.tick);
  app.innerHTML = `<div class="stack" style="max-width:520px;margin:0 auto"><p class="kick">Mercado em Jogo · Sala ${esc(P.code || '')}</p><div class="card"><p style="font-size:20px">${html}</p></div></div>`;
}

function countdown(secs){
  clearInterval(P.tick);
  const end = Date.now() + secs * 1000;
  const upd = () => { const el = $('pt'); if (!el){ clearInterval(P.tick); return; } const s = Math.max(0, Math.ceil((end - Date.now()) / 1000)); el.textContent = s + 's'; };
  upd(); P.tick = setInterval(upd, 500);
}

function renderDecide(round, secs, last){
  const sc = SCEN[round];
  let price = (last && last.price) || CFG.pref, es = (last && last.es) || 0;
  app.innerHTML = `
  <div class="stack" style="max-width:560px;margin:0 auto">
    <div class="row" style="justify-content:space-between;align-items:center"><p class="kick">Rodada ${round + 1} de ${CFG.rounds}</p><span class="big-num" id="pt" style="font-size:28px"></span></div>
    <div class="card stack"><h2>${esc(sc.t)}</h2><p class="mute">${esc(sc.d)}</p>
      <p class="note">Custo variável ${brl(sc.cv)} · tributos e despesas ${Math.round(CFG.varPct * 100)}% · fixos ${brl(CFG.fixed)} · referência ${brl(CFG.pref)}</p></div>
    <div class="card stack">
      <h3>1. Preço do sensor</h3>
      <input type="number" id="pi" min="500" max="4000" step="10" inputmode="numeric" value="${price}">
      <input type="range" id="pr" min="500" max="4000" step="10" value="${price}">
      <h3 style="margin-top:8px">2. Engenharia de vendas</h3>
      <div class="stack" id="ops">${ES.map((o, i) => `<label class="opt ${i === es ? 'sel' : ''}"><input type="radio" name="es" value="${i}" ${i === es ? 'checked' : ''}><span><b>${esc(o.n)}</b> · ${brl(o.c)}<br><span class="mute">${esc(o.s)}</span></span></label>`).join('')}</div>
    </div>
    <div class="card stack"><h3>Calculadora da sua decisão</h3><div class="kpis" id="calc"></div><p class="note" id="calcn"></p></div>
    <button class="btn big" id="send">Enviar decisão</button>
  </div>`;
  const pi = $('pi'), pr = $('pr');
  const calc = () => {
    const p = Number(pi.value) || 0; const mcu = p * (1 - CFG.varPct) - sc.cv; const fx = CFG.fixed + ES[es].c;
    const pe = mcu > 0 ? Math.ceil(fx / mcu) : null;
    $('calc').innerHTML = `
      <div class="kpi"><span class="mute">Piso (MC = 0)</span><b>${brl2(piso(sc.cv))}</b></div>
      <div class="kpi"><span class="mute">MC por sensor</span><b class="${cls(mcu)}">${brl2(mcu)}</b></div>
      <div class="kpi"><span class="mute">Margem de contribuição</span><b class="${cls(mcu)}">${p ? Math.round(100 * mcu / p) : 0}%</b></div>
      <div class="kpi"><span class="mute">Ponto de equilíbrio</span><b>${pe ? pe + ' sensores' : '—'}</b></div>`;
    $('calcn').textContent = mcu <= 0 ? 'Abaixo do piso: cada venda aumenta o prejuízo.' : `Você precisa vender ${pe} sensores para cobrir os fixos (${brl(fx)}) nesta rodada.`;
  };
  pi.oninput = () => { pr.value = pi.value; calc(); };
  pr.oninput = () => { pi.value = pr.value; calc(); };
  document.querySelectorAll('input[name=es]').forEach(r => r.onchange = () => {
    es = Number(r.value);
    document.querySelectorAll('.opt').forEach((l, i) => l.classList.toggle('sel', i === es));
    calc();
  });
  $('send').onclick = () => {
    const p = Math.round(Number(pi.value));
    if (!p || p < 500 || p > 4000){ $('calcn').textContent = 'Informe um preço entre R$ 500 e R$ 4.000.'; return; }
    if (P.conn && P.conn.open){ P.conn.send({type:'decision', round, price:p, es}); $('send').disabled = true; $('send').textContent = 'Enviando…'; }
    else $('calcn').textContent = 'Sem conexão no momento. Aguarde alguns segundos e tente de novo.';
  };
  calc(); countdown(secs);
}

function playerSent(d){
  playerWait(`Decisão enviada ✓<br><span class="mute">Preço ${brl(d.price)} · ${esc(ES[d.es] ? ES[d.es].n : '')}</span><br><br>Aguarde o fim da rodada.`);
}

function renderResult(d){
  clearInterval(P.tick);
  const r = d.r, sc = SCEN[d.round];
  app.innerHTML = `
  <div class="stack" style="max-width:560px;margin:0 auto">
    <p class="kick">Resultado · Rodada ${d.round + 1} de ${CFG.rounds}</p>
    <div class="card stack" style="text-align:center"><p class="mute">Sua posição</p><p class="big-num">${d.pos}º de ${d.n}</p><p>Lucro acumulado <b class="${cls(d.total)}">${brl(d.total)}</b></p></div>
    <div class="card stack">
      <div class="kpis">
        <div class="kpi"><span class="mute">Clientes conquistados</span><b>${r.q} sensores</b></div>
        <div class="kpi"><span class="mute">Receita</span><b>${brl(r.rev)}</b></div>
        <div class="kpi"><span class="mute">Margem de contribuição</span><b class="${cls(r.mc)}">${brl(r.mc)}</b></div>
        <div class="kpi"><span class="mute">Lucro da rodada</span><b class="${cls(r.lucro)}">${brl(r.lucro)}</b></div>
      </div>
      <p>${esc(tip(r, sc.cv))}</p>
      ${r.auto ? '<p class="note">Você não enviou a tempo: repetimos sua decisão anterior.</p>' : ''}
    </div>
    <p class="mute" style="text-align:center">${d.last ? 'Aguarde o pódio no telão!' : 'Aguarde a próxima rodada.'}</p>
  </div>`;
}

function renderFinal(d){
  clearInterval(P.tick);
  const medal = ['🥇', '🥈', '🥉'][d.pos - 1] || '🏁';
  app.innerHTML = `
  <div class="stack" style="max-width:560px;margin:0 auto;text-align:center">
    <p class="kick">Fim de jogo</p>
    <p style="font-size:72px">${medal}</p>
    <h2 style="font-size:36px">${d.pos}º lugar de ${d.n}</h2>
    <p>Lucro acumulado: <b class="${cls(d.total)}">${brl(d.total)}</b></p>
    <div class="card stack" style="text-align:left"><h3>Pódio</h3>
      ${d.podium.map((p, i) => `<p>${['🥇', '🥈', '🥉'][i]} <b>${esc(p.name)}</b> · ${brl(p.total)}</p>`).join('')}
    </div>
  </div>`;
}

function home(){
  app.innerHTML = `
  <div class="stack" style="max-width:640px;margin:40px auto">
    <p class="kick">IFSP · Engenharia Econômica e Financeira</p>
    <h1 style="font-size:48px">Mercado em Jogo</h1>
    <p class="mute" style="font-size:18px">Simulação de vendas: cada participante comanda uma empresa de sensores industriais, define preço e ação comercial, disputa clientes e tenta terminar com o maior lucro.</p>
    <div class="card stack">
      <h3>Sou o apresentador</h3>
      <p class="mute">Abra no computador ligado ao projetor.</p>
      <button class="btn big" id="h">Abrir sala</button>
    </div>
    <div class="card stack">
      <h3>Vou jogar</h3>
      <form id="j" class="row"><input type="text" id="code" maxlength="6" placeholder="Código da sala" style="flex:1;min-width:160px;text-transform:uppercase"><button class="btn" type="submit">Entrar</button></form>
    </div>
  </div>`;
  $('h').onclick = startHost;
  $('j').onsubmit = e => { e.preventDefault(); const c = $('code').value.trim().replace(/[^A-Za-z0-9]/g, ''); if (c) { history.replaceState(null, '', '?sala=' + c.toUpperCase()); startPlayer(c); } };
}

(async () => {
  await loadLibs();
  const sala = new URLSearchParams(location.search).get('sala');
  if (sala && /^[A-Za-z0-9]{2,8}$/.test(sala)) startPlayer(sala);
  else home();
})();

window.addEventListener('beforeunload', e => { if (H.peer && H.phase !== 'lobby' && H.phase !== 'final'){ e.preventDefault(); e.returnValue = ''; } });
