<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mercado em Jogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#14213d;--card:#1f2f52;--deep:#0f1a31;--line:#34446a;--ink:#f6f4ef;--mute:#aab3c5;--or:#e07a2c;--or2:#f0a35e;--blue:#5b9be0;--bad:#ff8a80;--good:#7fd6a4;--warn:#ffd36e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--navy);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;margin:0;line-height:1.1}
p{margin:0;line-height:1.45}
button{font-family:inherit}
#app{max-width:1280px;margin:0 auto;padding:12px 12px 32px}
.phone{max-width:480px;margin:0 auto}
.kick{font-size:12px;letter-spacing:2px;font-weight:700;color:var(--or2);text-transform:uppercase}
.card{background:var(--card);border-radius:18px;padding:14px}
.deep{background:var(--deep);border-radius:14px;padding:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.grow{flex:1;min-width:220px}
.center{text-align:center}
.mute{color:var(--mute)} .good{color:var(--good)} .bad{color:var(--bad)}
.note{font-size:12px;color:var(--mute)}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font:700 16px Inter,sans-serif;cursor:pointer;background:var(--or);color:#14213d}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.big{font-size:19px;padding:16px 24px}
input[type=text]{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--deep);color:var(--ink);font:600 19px Inter,sans-serif}
input:focus{outline:none;border-color:var(--or2)}
.big-num{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:38px}
/* HUD */
.hud{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:6px;position:sticky;top:0;z-index:5;background:var(--navy);padding:4px 0}
.hc{background:var(--deep);border-radius:12px;padding:6px 10px}
.hc span{display:block;font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.hc b{font-family:"Space Grotesk",Inter,sans-serif;font-size:20px;white-space:nowrap}
.tbar{height:6px;background:var(--deep);border-radius:3px;overflow:hidden;margin:4px 0 6px}
.tbar i{display:block;height:100%;background:var(--or);width:0}
.news{display:flex;gap:8px;align-items:center;background:#1c2b45;border-left:5px solid var(--blue);border-radius:10px;padding:7px 10px;font-size:13px;margin-bottom:6px}
.news .ic{font-size:22px}
.mapwrap{border-radius:18px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#map{display:block;width:100%;height:auto;user-select:none}
.lbl{font:800 9px Inter,sans-serif;fill:#14213d}
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.counters div{background:var(--deep);border-radius:10px;padding:6px;text-align:center;font-size:11px;color:var(--mute)}
.counters b{display:block;font-size:18px;color:var(--ink)}
.price{background:var(--card);border-radius:16px;padding:12px;margin-top:8px}
.pr{display:flex;align-items:center;gap:10px}
.pr button{flex:none;width:56px;height:56px;border-radius:14px;border:0;background:var(--deep);color:var(--ink);font-size:30px;font-weight:800;cursor:pointer}
.pr button:active{background:var(--or);color:#14213d}
.pr .val{flex:1;text-align:center}
.pr .val b{font-family:"Space Grotesk",Inter,sans-serif;font-size:34px;white-space:nowrap}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:800;font-size:12px;margin-top:2px}
.margin{margin-top:8px;text-align:center;font-size:14px}
.ups{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.up{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;color:var(--ink);font-family:inherit}
.up:active{border-color:var(--or2)}
.up .ic{font-size:30px;line-height:1}
.up b{display:block;font-size:13px;margin-top:4px}
.up small{display:block;font-size:11px;color:var(--mute);margin-top:2px;min-height:28px}
.up .cost{display:inline-block;margin-top:6px;background:var(--or);color:#14213d;border-radius:999px;padding:3px 8px;font-weight:800;font-size:12px}
.up.max .cost{background:var(--line);color:var(--ink)}
.up.poor .cost{background:var(--deep);color:var(--mute)}
.lv{font-size:11px;color:var(--or2);font-weight:700}
/* modal de evento */
.modal{position:fixed;inset:0;background:rgba(5,10,20,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-in{background:var(--card);width:100%;max-width:440px;border-radius:22px;padding:20px;animation:pop .3s ease-out;text-align:center}
.modal-in .who{font-size:64px;line-height:1}
.choice{display:block;width:100%;border:0;border-radius:14px;padding:16px;margin-top:10px;font:800 17px Inter,sans-serif;cursor:pointer}
.choice.a{background:var(--or);color:#14213d}
.choice.b{background:var(--deep);color:var(--ink);border:2px solid var(--line)}
.choice small{display:block;font-weight:600;font-size:12px;margin-top:3px;opacity:.85}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.hidden{display:none!important}
#toasts{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:15;display:flex;flex-direction:column;gap:6px;width:min(440px,94vw);pointer-events:none}
.toast{background:rgba(11,20,38,.95);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:pop .3s ease-out}
.toast.big{border-color:var(--or2);font-size:15px}
.badge{display:flex;gap:10px;align-items:center;background:var(--deep);border-radius:14px;padding:12px 14px}
.badge .ic{font-size:28px}
/* host */
.host h1{font-size:48px}
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.lot{background:#6fa83d;border-radius:14px;padding:10px;color:#14213d;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.lot .bi{font-size:44px;line-height:1}
.lot .nm{font-weight:800;font-size:19px;margin-top:4px;word-break:break-word}
.lot .val{font-weight:800;font-size:24px}
.lot .sub{font-size:14px}
.lot.neg{background:#c26a4a}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:17px}
.chip{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--deep);margin:4px;font-size:15px}
.chip.ok{background:#2c5a3f}
#qr{background:#fff;padding:12px;border-radius:14px;display:inline-block}
#qr img,#qr canvas{display:block}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:16px}
.stepP{width:210px;border-radius:16px 16px 0 0;display:flex;flex-direction:column;align-items:center;padding:16px 10px;text-align:center;animation:rise .9s ease-out both;color:#14213d}
.stepP .pos{font-family:"Space Grotesk";font-size:52px;font-weight:700}
.stepP .nm{font-size:21px;font-weight:700;margin-top:6px;word-break:break-word}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.confetti{position:fixed;top:-20px;font-size:24px;pointer-events:none;animation:fall linear forwards;z-index:40}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.warnbox{background:#4a2a12;border-radius:12px;padding:12px 16px;color:#ffd7b3}
.newsH{background:#1c2b45;border-left:6px solid var(--blue);border-radius:14px;padding:14px 18px;display:flex;gap:14px;align-items:center}
.newsH .ic{font-size:44px}
.tut{display:flex;gap:12px;align-items:center;background:var(--deep);border-radius:14px;padding:12px}
.tut .ic{font-size:34px}
@media (max-width:640px){.host h1{font-size:32px}}
</style>
</head>
<body>
<div id="app"><p class="mute">Carregando…</p></div>
<div id="toasts"></div>

<script>
/* =====================================================================
   CONFIGURAÇÃO DO JOGO (ajuste aqui)
   ===================================================================== */
const G = {
  months: 12,        // meses do jogo
  monthMs: 50000,    // 50 s por mês → 12 meses = 10 minutos
  cycles: 10,        // ciclos por mês (1 ciclo = 5 s)
  startCash: 30000,  // dinheiro inicial para investir
  fixed: 10000,      // custos fixos por mês (aluguel, salários)
  varPct: 0.18,      // impostos e comissões sobre o preço
  pref: 1500,        // preço de referência da cidade
  base: 60,          // clientes por mês no preço de referência
  truckCap: 40,      // entregas por mês de cada caminhão
  startTrucks: 2
};
const CYCLE_MS = G.monthMs / G.cycles;
const TOTAL_MS = G.months * G.monthMs;

// Melhorias (compra única, até 3 níveis)
const UPS = {
  truck: {ic:'🚚', n:'Caminhão', d:'+40 entregas por mês', cost:[15000, 18000, 22000]},
  sales: {ic:'🧑‍💼', n:'Vendedor', d:'+20% de clientes', cost:[12000, 15000, 18000]},
  mach:  {ic:'⚙️', n:'Máquina nova', d:'−R$ 80 de custo por sensor', cost:[20000, 24000, 28000]}
};

// Notícias da cidade (iguais para todos)
const NEWS = [
  {m:0,  ic:'📈', t:'Mercado aberto',             d:'Encontre o preço que traz clientes e deixa margem.', beta:3,   dem:1,    cost:800, shift:0},
  {m:2,  ic:'🔩', t:'O aço subiu',                d:'Cada sensor passou a custar R$ 920 para fabricar.',   beta:3,   dem:1,    cost:920, shift:0},
  {m:4,  ic:'🏦', t:'Juros altos',                d:'Clientes adiaram compras: 20% menos procura.',        beta:3,   dem:0.8,  cost:920, shift:0},
  {m:6,  ic:'🚢', t:'Chegou um importado barato', d:'Os clientes ficaram mais sensíveis a preço.',          beta:5,   dem:0.9,  cost:880, shift:-150},
  {m:8,  ic:'🏭', t:'Indústria aquecida',         d:'Fábricas da região crescendo: 30% mais procura.',     beta:3,   dem:1.3,  cost:880, shift:0},
  {m:10, ic:'🎄', t:'Pedidos de fim de ano',      d:'Clientes estocando antes das férias: +15% de procura.', beta:2.5, dem:1.15, cost:850, shift:0}
];
const newsAt = m => { let c = NEWS[0]; for (const e of NEWS) if (e.m <= m) c = e; return c; };

/* =====================================================================
   UTILITÁRIOS
   ===================================================================== */
const app = document.getElementById('app');
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => (n < 0 ? '−' : '') + 'R$ ' + Math.abs(Math.round(n)).toLocaleString('pt-BR');
const brlK = n => { const a = Math.abs(n); const s = a >= 1e6 ? (a / 1e6).toFixed(2).replace('.', ',') + ' mi' : a >= 1e4 ? Math.round(a / 1000) + ' mil' : a >= 1000 ? (a / 1000).toFixed(1).replace('.', ',') + ' mil' : Math.round(a); return (n < 0 ? '−' : '') + 'R$ ' + s; };
const sgn = n => (n >= 0 ? '+' : '') + brlK(n);
const cls = n => n < 0 ? 'bad' : 'good';
const rnd = n => Math.random().toString(36).slice(2, 2 + n);
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const baseUrl = () => location.origin + location.pathname;
function toast(html, ms, cl){
  const t = document.createElement('div'); t.className = 'toast ' + (cl || ''); t.innerHTML = html;
  $('toasts').appendChild(t); setTimeout(() => t.remove(), ms || 3500);
  const all = $('toasts').children; if (all.length > 2) all[0].remove();
}
function confetti(){
  const em = ['🎉','✨','🏆','💰','🎊'];
  for (let i = 0; i < 40; i++){
    const s = document.createElement('span'); s.className = 'confetti'; s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDuration = (2.5 + Math.random() * 2.5) + 's'; s.style.animationDelay = Math.random() * 1.5 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 7000);
  }
}
function loadScript(src){return new Promise((ok, no) => {const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s);});}
async function loadLibs(){
  if (!window.Peer) for (const u of ["https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js","https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"]) { try { await loadScript(u); if (window.Peer) break; } catch(e){} }
  if (!window.QRCode) for (const u of ["https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js","https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"]) { try { await loadScript(u); if (window.QRCode) break; } catch(e){} }
}
function blockedMsg(){
  app.innerHTML = `<div class="card stack" style="max-width:640px;margin:40px auto">
    <h2>Não consegui conectar</h2>
    <p>Este navegador ou esta rede bloqueou a conexão do jogo.</p>
    <p class="mute">Abra o endereço do jogo no Chrome, Edge ou Safari. Se a rede bloquear, use o 4G.</p>
    <button class="btn" onclick="location.reload()">Tentar de novo</button></div>`;
}

/* =====================================================================
   SIMULAÇÃO (no celular de cada jogador)
   ===================================================================== */
let S = null;
function newState(){
  return {cash:G.startCash, price:G.pref, lv:{truck:0, sales:0, mach:0}, solar:0,
    gc:-1, avg:null, sellAcc:0, arrAcc:0,
    fx:{fair:0, comp:0, demo:0, brk:0, strike:0, cheap:0},
    mon:{arr:0, sold:0, quit:0, full:0, gross:0}, hist:[], sold:0, quit:0, full:0,
    receivables:[], nextEv:4, ev:null, evDeadline:0, deck:[], done:false};
}
const month = () => Math.max(0, Math.min(G.months - 1, Math.floor(Math.max(0, S.gc) / G.cycles)));
const unitCost = () => Math.max(400, newsAt(month()).cost - 80 * S.lv.mach - (S.fx.cheap > 0 ? 120 : 0) + S.solar);
const perSale = () => S.price * (1 - G.varPct) - unitCost();
const capMonth = () => (G.startTrucks + S.lv.truck) * G.truckCap * (S.fx.brk > 0 ? 0.5 : 1) * (S.fx.strike > 0 ? 0.5 : 1);
const result = () => S.cash - G.startCash;
function priceEffect(){
  const n = newsAt(month()), ref = G.pref + n.shift, pm = S.avg || S.price;
  return Math.exp(-n.beta * (S.price - (0.5 * pm + 0.5 * ref)) / G.pref);
}
function potential(){
  const n = newsAt(month());
  let d = G.base * n.dem * (1 + 0.2 * S.lv.sales);
  if (S.fx.fair > 0) d *= 1.3;
  if (S.fx.demo > 0) d *= 1.15;
  if (S.fx.comp > 0) d *= 0.8;
  return d;
}
const demand = () => Math.min(300, potential() * priceEffect());

function cycle(){
  S.gc++;
  const gc = S.gc;
  // recebíveis de eventos
  S.receivables = S.receivables.filter(r => {
    if (r.at > gc) return true;
    if (Math.random() < r.p){ S.cash += r.v; toast(`💳 ${esc(r.who)} pagou ${brl(r.v)}!`); }
    else toast(`😞 Calote: ${esc(r.who)} não pagou.`, 4500);
    return false;
  });
  // clientes deste ciclo
  const pot = potential() / G.cycles, eff = priceEffect();
  const arriving = pot * Math.max(1, eff);      // quem vem até a fábrica
  const wanting = pot * eff;                      // quem aceita o preço
  const cap = capMonth() / G.cycles;
  S.arrAcc += arriving;
  const nArr = Math.floor(S.arrAcc); S.arrAcc -= nArr;
  const pBuy = arriving > 0 ? Math.min(wanting, cap) / arriving : 0;
  const pWant = arriving > 0 ? wanting / arriving : 0;
  let sold = 0, quit = 0, full = 0;
  const fxList = [];
  for (let i = 0; i < nArr; i++){
    const r = Math.random();
    if (r < pBuy){ sold++; fxList.push('buy'); }
    else if (r < pWant){ full++; fxList.push('full'); }
    else { quit++; fxList.push('quit'); }
  }
  const gross = sold * perSale();
  S.cash += gross;
  S.sold += sold; S.quit += quit; S.full += full;
  const m = S.mon; m.arr += nArr; m.sold += sold; m.quit += quit; m.full += full; m.gross += gross;
  MAP.spawn(fxList, perSale());
  if (sold > 0) MAP.truck();
  // efeitos temporários
  for (const k in S.fx) if (S.fx[k] > 0) S.fx[k]--;
  // fim do mês
  if (gc % G.cycles === G.cycles - 1) closeMonth();
  // eventos
  if (!S.ev && gc >= S.nextEv && gc < G.months * G.cycles - 3) spawnEvent();
  if (gc >= G.months * G.cycles - 1) finishGame();
}
function closeMonth(){
  S.cash -= G.fixed;
  const m = S.mon; m.lucro = m.gross - G.fixed; m.month = month();
  S.hist.push(m);
  S.mon = {arr:0, sold:0, quit:0, full:0, gross:0};
  const face = m.lucro > 15000 ? '🤑' : m.lucro > 0 ? '😄' : '😬';
  toast(`<b>${face} Mês ${m.month + 1}: lucro <span class="${cls(m.lucro)}">${sgn(m.lucro)}</span></b><br>
    <span class="mute">🛒 ${m.sold} vendas · 💸 ${m.quit} acharam caro${m.full ? ` · 🚚 ${m.full} sem entrega` : ''} · custos fixos ${brlK(G.fixed)}</span>`, 5000, 'big');
}
function buyUp(k){
  if (!S || S.done) return;
  const u = UPS[k], lv = S.lv[k];
  if (lv >= u.cost.length){ toast('Nível máximo!'); return; }
  const c = u.cost[lv];
  if (S.cash < c){ toast(`💰 Falta dinheiro: precisa de ${brl(c)}.`); return; }
  S.cash -= c; S.lv[k]++;
  toast(`${u.ic} ${u.n} comprado! ${u.d}.`);
  MAP.refresh(); UI.render();
}

/* ----- Eventos ----- */
const EVENTS = [
  {who:'🚛', name:'Fornecedor novo',
   text:() => `Pague R$ 8.000 adiantados e eu vendo aço mais barato: −R$ 120 por sensor durante 2 meses.`,
   a:{t:'Fechar negócio', s:'−R$ 8.000 agora', f:() => { S.cash -= 8000; S.fx.cheap = 2 * G.cycles; return 'Custo por sensor caiu R$ 120 por 2 meses.'; }},
   b:{t:'Recusar', s:'nada muda', f:() => 'Você manteve o fornecedor de sempre.'}},
  {who:'🏗️', name:'Construtora Horizonte',
   text:() => `Quero 30 sensores agora, pagando R$ 1.100 cada.`,
   a:{t:'Vender a R$ 1.100', s:() => { const v = 30 * (1100 * (1 - G.varPct) - unitCost()); return 'resultado: ' + sgn(v); },
      f:() => { const v = 30 * (1100 * (1 - G.varPct) - unitCost()); S.cash += v; S.sold += 30; MAP.truck(); return v >= 0 ? `Venda fechada: ${sgn(v)}.` : `Venda abaixo do custo: ${sgn(v)}. Cuidado com o piso!`; }},
   b:{t:'Recusar', s:'nada muda', f:() => 'A construtora foi procurar outro fornecedor.'}},
  {who:'🔧', name:'Máquina quebrou!',
   text:() => `A linha parou. O técnico cobra R$ 5.000 para consertar agora. Sem conserto, você atende metade dos clientes por 1 mês.`,
   a:{t:'Consertar agora', s:'−R$ 5.000', f:() => { S.cash -= 5000; return 'Fábrica funcionando normalmente.'; }},
   b:{t:'Esperar a peça', s:'metade das entregas por 1 mês', f:() => { S.fx.brk = G.cycles; return 'Produção pela metade durante 1 mês.'; }}},
  {who:'🎪', name:'Feira da Indústria',
   text:() => `Um estande na feira custa R$ 6.000 e traz +30% de clientes por 2 meses.`,
   a:{t:'Participar', s:'−R$ 6.000', f:() => { S.cash -= 6000; S.fx.fair = 2 * G.cycles; return '+30% de clientes por 2 meses!'; }},
   b:{t:'Não ir', s:'nada muda', f:() => 'Você ficou de fora da feira.'}},
  {who:'💳', name:'Cliente atrasou o pagamento',
   text:() => `A Metalúrgica Sul te deve R$ 12.000. Ela paga R$ 10.000 hoje… ou tudo daqui a 2 meses, se não der calote.`,
   a:{t:'Receber R$ 10.000 hoje', s:'+R$ 10.000 garantido', f:() => { S.cash += 10000; return 'Dinheiro no caixa, com desconto.'; }},
   b:{t:'Esperar 2 meses', s:'70% de chance de receber R$ 12.000', f:() => { S.receivables.push({v:12000, p:0.7, at:S.gc + 2 * G.cycles, who:'Metalúrgica Sul'}); return 'Vamos torcer para ela pagar…'; }}},
  {who:'✊', name:'Greve dos caminhoneiros',
   text:() => `As entregas vão cair pela metade durante 1 mês. Uma transportadora cobra R$ 4.000 para manter tudo rodando.`,

function spawnEvent(){

function chooseEvent(which, auto){

function finishGame(){

/* =====================================================================

const ROAD = 196;
const FAB = {x:180, y:120};
const SPOTS = [
  {x:20,  y:ROAD, ic:'🏘️', n:'Bairro'},
  {x:340, y:ROAD, ic:'🏬', n:'Comércio'},
  {x:60,  y:300,  ic:'🏭', n:'Indústria'},
  {x:300, y:300,  ic:'🏗️', n:'Construtora'}
];
const PEOPLE = ['🧑','👩','👨‍🔧','👷','🧑‍💼','👩‍🔬'];
const MAP = {
  movers:[], running:false,
  svg(name){
    const trees = [[24,40],[70,70],[120,30],[250,36],[300,70],[340,30],[30,260],[130,280],[230,280],[340,250],[90,150],[275,150]]
      .map(([x, y]) => `<text x="${x}" y="${y}" font-size="16" text-anchor="middle">🌳</text>`).join('');
    const spots = SPOTS.map(s => `<text x="${s.x}" y="${s.y - (s.y === ROAD ? 22 : 4)}" font-size="26" text-anchor="middle">${s.ic}</text>`).join('');
    const w = Math.max(70, name.length * 6 + 16);
    return `<svg id="map" viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
      <defs><pattern id="gr" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.2" fill="#33691e"/></pattern></defs>
      <rect width="360" height="320" fill="#7cb342"/><rect width="360" height="320" fill="url(#gr)" opacity=".3"/>
      <path d="M-10 ${ROAD} H370" stroke="#5f6670" stroke-width="22" fill="none"/>
      <path d="M-10 ${ROAD} H370" stroke="#f5d547" stroke-width="1.5" stroke-dasharray="8 8" fill="none"/>
      <path d="M${FAB.x} ${FAB.y + 20} V${ROAD}" stroke="#5f6670" stroke-width="16" fill="none"/>
      <path d="M60 300 V${ROAD} M300 300 V${ROAD}" stroke="#5f6670" stroke-width="12" fill="none"/>
      ${trees}${spots}
      <circle cx="${FAB.x}" cy="${FAB.y}" r="42" fill="rgba(255,214,110,.8)" stroke="#e07a2c" stroke-width="3"/>
      <text x="${FAB.x}" y="${FAB.y + 2}" font-size="50" text-anchor="middle" dominant-baseline="central">🏭</text>
      <rect x="${FAB.x - w / 2}" y="${FAB.y + 36}" width="${w}" height="16" rx="8" fill="#fff"/>
      <text class="lbl" x="${FAB.x}" y="${FAB.y + 47}" text-anchor="middle" font-size="10">${esc(name)}</text>
      <g id="upsLayer"></g>
      <g id="fx"></g>
    </svg>`;
  },
  refresh(){
    const L = $('upsLayer'); if (!L || !S) return;
    let h = '';
    const nt = G.startTrucks + S.lv.truck;
    for (let i = 0; i < nt; i++) h += `<text x="${96 - (i % 3) * 22}" y="${118 + Math.floor(i / 3) * 22}" font-size="18" text-anchor="middle">🚚</text>`;
    for (let i = 0; i < S.lv.sales; i++) h += `<text x="${242 + (i % 3) * 20}" y="${110 + Math.floor(i / 3) * 22}" font-size="18" text-anchor="middle">🧑‍💼</text>`;
    for (let i = 0; i < S.lv.mach; i++) h += `<text x="${FAB.x - 20 + i * 20}" y="${FAB.y - 50}" font-size="16" text-anchor="middle">⚙️</text>`;
    h += `<text x="78" y="88" class="lbl" text-anchor="middle">Frota</text>`;
    if (S.lv.sales) h += `<text x="262" y="88" class="lbl" text-anchor="middle">Vendas</text>`;
    L.innerHTML = h;
  },
  el(txt, size){
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.textContent = txt; t.setAttribute('font-size', size || 18); t.setAttribute('text-anchor', 'middle'); t.setAttribute('dominant-baseline', 'central');
    const L = $('fx'); if (!L) return null; L.appendChild(t); return t;
  },
  // clientes andando até a fábrica
  spawn(list, margin){
    if (!$('fx')) return;
    const show = list.slice(0, 7);
    show.forEach((kind, i) => {
      const s = SPOTS[ri(0, SPOTS.length - 1)];
      const p = [{x:s.x, y:s.y}, {x:s.x, y:ROAD}, {x:FAB.x, y:ROAD}, {x:FAB.x, y:FAB.y + 30}];
      const delay = i * 550 + Math.random() * 300;
      setTimeout(() => {
        const el = this.el(PEOPLE[ri(0, PEOPLE.length - 1)], 17); if (!el) return;
        if (kind === 'buy'){
          this.add({el, pts:p, dur:2600, done:() => this.float(FAB.x + ri(-30, 30), FAB.y - 10, '+' + brlK(margin), margin >= 0 ? '#1b5e20' : '#b71c1c')});
        } else {
          const half = [p[0], p[1], {x:(p[1].x + FAB.x) / 2, y:ROAD}];
          this.add({el, pts:half, dur:1500, done:() => {
            const e2 = this.el(kind === 'quit' ? '💸' : '🚚❌', 14);
            if (e2){ e2.setAttribute('x', half[2].x); e2.setAttribute('y', ROAD - 22); this.add({el:e2, float:true, x:half[2].x, y:ROAD - 22, dur:1300}); }
            const back = this.el(PEOPLE[ri(0, PEOPLE.length - 1)], 17);
            if (back) this.add({el:back, pts:half.slice().reverse(), dur:1300});
          }});
        }
      }, delay);
    });
  },
  truck(){
    const s = SPOTS[ri(0, SPOTS.length - 1)];
    const el = this.el('🚚', 18); if (!el) return;
    this.add({el, pts:[{x:FAB.x, y:FAB.y + 30}, {x:FAB.x, y:ROAD}, {x:s.x, y:ROAD}, {x:s.x, y:s.y}], dur:2600});
  },
  float(x, y, txt, col){
    const t = this.el(txt, 12); if (!t) return;
    t.setAttribute('font-weight', '800'); t.setAttribute('fill', col || '#14213d');
    t.setAttribute('stroke', '#fff'); t.setAttribute('stroke-width', '3'); t.setAttribute('paint-order', 'stroke');
    this.add({el:t, float:true, x, y, dur:1500});
  },
  add(m){
    m.t0 = performance.now();
    if (m.pts){ m.seg = []; m.tot = 0; for (let i = 1; i < m.pts.length; i++){ const d = Math.hypot(m.pts[i].x - m.pts[i-1].x, m.pts[i].y - m.pts[i-1].y); m.seg.push(d); m.tot += d; } }
    this.movers.push(m); this.run();
  },
  run(){
    if (this.running) return; this.running = true;
    const step = now => {
      this.movers = this.movers.filter(m => {
        const k = Math.min(1, (now - m.t0) / m.dur);
        if (m.float){ m.el.setAttribute('x', m.x); m.el.setAttribute('y', m.y - 24 * k); m.el.setAttribute('opacity', String(1 - k * k)); }
        else {
          let d = k * m.tot, i = 0;
          while (i < m.seg.length - 1 && d > m.seg[i]){ d -= m.seg[i]; i++; }
          const a = m.pts[i], b = m.pts[i + 1], r = m.seg[i] ? d / m.seg[i] : 1;
          const x = a.x + (b.x - a.x) * r, y = a.y + (b.y - a.y) * r;
          m.el.setAttribute('x', x); m.el.setAttribute('y', y - 4);
          m.el.setAttribute('transform', b.x > a.x ? `scale(-1,1) translate(${-2 * x},0)` : '');
        }
        if (k >= 1){ m.el.remove(); if (m.done) m.done(); return false; }
        return true;
      });
      if (this.movers.length) requestAnimationFrame(step); else this.running = false;
    };
    requestAnimationFrame(step);
  }
};

const P = {code:null, pid:null, name:'', peer:null, conn:null, tries:0, t0:null, rank:null, n:null, statT:null, loopT:null, avg:null};
P.elapsed = () => P.t0 == null ? 0 : Date.now() - P.t0;
P.sendStat = () => {
  if (!S || !P.conn || !P.conn.open) return;
  try { P.conn.send({type:'stat', price:S.price, res:Math.round(result()), sold:S.sold, quit:S.quit, ups:S.lv.truck + S.lv.sales + S.lv.mach, done:S.done}); } catch(e){}
};
function startPlayer(code){
  P.code = code.toUpperCase();
  P.pid = store.get('mj3_pid') || ('p-' + rnd(10)); store.set('mj3_pid', P.pid);
  const saved = store.get('mj3_name') || '';
  app.innerHTML = `
  <div class="phone stack" style="margin-top:20px">
    <p class="kick">Mercado em Jogo · Sala ${esc(P.code)}</p>
    <h2 style="font-size:30px">🏭 Dê um nome à sua fábrica</h2>
    <form id="f" class="stack">
      <input type="text" id="nm" maxlength="16" placeholder="Ex.: Sensores do João" value="${esc(saved)}" autocomplete="off">
      <button class="btn big" type="submit">Entrar no jogo</button>
    </form>
  </div>`;
  $('f').onsubmit = e => {
    e.preventDefault();
    const n = $('nm').value.trim(); if (!n){ $('nm').focus(); return; }
    P.name = n.slice(0, 16); store.set('mj3_name', P.name);
    playerWait('Conectando…'); connect();
  };
}
function connect(){
  if (!window.Peer){ playerWait('Não foi possível carregar a conexão. Verifique a internet e recarregue.'); return; }
  try { if (P.peer) P.peer.destroy(); } catch(e){}
  try { P.peer = new Peer(); } catch(e){ blockedMsg(); return; }
  P.peer.on('open', () => {
    const c = P.peer.connect('mercado-v3-' + P.code.toLowerCase(), {reliable:true});
    P.conn = c;
    c.on('open', () => { P.tries = 0; c.send({type:'join', pid:P.pid, name:P.name}); });
    c.on('data', playerData);
    c.on('close', () => { if (P.conn === c) retry(); });
  });
  P.peer.on('error', e => {
    if (e.type === 'peer-unavailable'){ if (!S) playerWait('Sala não encontrada. Confira se o telão está aberto com este código. Tentando de novo…'); setTimeout(connect, 4000); }
    else retry();
  });
}
function retry(){
  P.tries++;
  if (S && !S.done) toast('📡 Reconectando ao telão… (seu jogo continua)');
  else if (!S) playerWait('Conexão perdida. Reconectando…');
  setTimeout(connect, Math.min(8000, 1500 * P.tries));
}
function playerWait(html){
  app.innerHTML = `<div class="phone stack" style="margin-top:20px"><p class="kick">Mercado em Jogo · Sala ${esc(P.code || '')}</p><div class="card"><p style="font-size:19px">${html}</p></div></div>`;
}
function renderLobby(){
  app.innerHTML = `<div class="phone stack" style="margin-top:16px">
    <p class="kick">Mercado em Jogo · Sala ${esc(P.code)}</p>
    <div class="card stack center"><p style="font-size:44px">🏭</p><h2>${esc(P.name)} está no jogo!</h2><p class="mute">Aguarde o apresentador começar. É simples:</p></div>
    <div class="tut"><span class="ic">🏷️</span><div><b>1. Escolha o preço</b><br><span class="mute">Caro: clientes desistem 💸. Barato demais: sobra pouco por venda.</span></div></div>
    <div class="tut"><span class="ic">🚚</span><div><b>2. Invista para crescer</b><br><span class="mute">Caminhão, vendedor e máquina nova custam, mas rendem.</span></div></div>
    <div class="tut"><span class="ic">❗</span><div><b>3. Decida os imprevistos</b><br><span class="mute">Fornecedores, clientes e problemas aparecem com 2 opções.</span></div></div>
    <div class="tut"><span class="ic">🏆</span><div><b>Vence quem lucrar mais em 12 meses</b><br><span class="mute">O jogo dura cerca de 10 minutos.</span></div></div>
  </div>`;
}
function playerData(d){
  if (!d || typeof d !== 'object') return;
  if (d.type === 'lobby'){ if (!S) renderLobby(); }
  else if (d.type === 'start' || d.type === 'tick'){
    const el = Number(d.el) || 0;
    if (P.t0 == null || Math.abs(P.elapsed() - el) > 1500) P.t0 = Date.now() - el;
    if (d.avg){ P.avg = d.avg; if (S) S.avg = d.avg; }
    if (d.rank){ P.rank = d.rank; P.n = d.n; }
    if (!S && el < TOTAL_MS) beginGame(el);
  }
  else if (d.type === 'end') showFinal(d);
  else if (d.type === 'closed') playerWait('O jogo desta sala já terminou.');
}
function beginGame(el){
  S = newState(); S.avg = P.avg || null;
  S.gc = Math.floor(el / CYCLE_MS) - 1;
  if (S.gc >= 0) S.nextEv = S.gc + 4;
  UI.build();
  toast('🏁 Valendo! Ajuste o preço e veja os clientes chegando.', 4000);
  clearInterval(P.loopT);
  P.loopT = setInterval(() => {
    if (!S || S.done) return;
    const target = Math.min(G.months * G.cycles, Math.floor(P.elapsed() / CYCLE_MS));
    let guard = 0;
    while (S.gc < target - 1 && guard++ < 200 && !S.done) cycle();
  }, 250);
  clearInterval(P.statT); P.statT = setInterval(P.sendStat, 3000);
}
function showFinal(d){
  if (S && !S.done) finishGame();
  if (!S){ playerWait('O jogo terminou.'); return; }
  const w = $('endWait'), f = $('endFinal'); if (!f) return;
  if (w) w.remove();
  const medal = ['🥇', '🥈', '🥉'][d.pos - 1] || '🏅';
  f.innerHTML = `<div class="card stack">
    <p style="font-size:60px">${medal}</p><h2>${d.pos}º lugar de ${d.n}</h2>
    ${(d.awards || []).map(a => `<div class="badge" style="text-align:left"><span class="ic">${a.ic}</span><div><b>${esc(a.t)}</b><br><span class="note">${esc(a.s)}</span></div></div>`).join('')}
    <div style="text-align:left">${d.podium.map((p, i) => `<p style="font-size:17px">${['🥇','🥈','🥉'][i]} <b>${esc(p.name)}</b> · ${sgn(p.res)}</p>`).join('')}</div>
  </div><p class="mute">Obrigado por jogar! 👏</p>`;
  if (d.pos <= 3) confetti();
}

/* =====================================================================
   APRESENTADOR (telão)
   ===================================================================== */
const H = {code:null, peer:null, players:{}, phase:'lobby', t0:0, timer:null};
const hostPlayers = () => Object.values(H.players);
const hostEl = () => H.phase === 'run' ? Date.now() - H.t0 : 0;
function sendTo(p, msg){ if (p.conn && p.conn.open){ try { p.conn.send(msg); } catch(e){} } }
function ranking(){ return hostPlayers().slice().sort((a, b) => (b.st ? b.st.res : -1e12) - (a.st ? a.st.res : -1e12)); }
function avgPrice(){ const ps = hostPlayers().filter(p => p.st); return ps.length ? ps.reduce((a, p) => a + p.st.price, 0) / ps.length : null; }

function startHost(){
  if (!window.Peer){ blockedMsg(); return; }
  H.code = rnd(4).toUpperCase();
  app.innerHTML = `<div class="card"><p>Abrindo a sala…</p></div>`;
  try { H.peer = new Peer('mercado-v3-' + H.code.toLowerCase()); } catch(e){ blockedMsg(); return; }
  const my = H.peer;
  setTimeout(() => { if (H.peer === my && !my.open && H.phase === 'lobby') blockedMsg(); }, 12000);
  H.peer.on('open', () => renderHostLobby());
  H.peer.on('connection', conn => {
    conn.on('data', d => hostData(conn, d));
    conn.on('close', () => { const p = H.players[conn._pid]; if (p && p.conn === conn){ p.online = false; if (H.phase === 'lobby') renderHostLobby(); } });
  });
  H.peer.on('disconnected', () => { try { H.peer.reconnect(); } catch(e){} });
  H.peer.on('error', e => { if (e.type === 'unavailable-id'){ H.peer.destroy(); startHost(); } });
}
function hostData(conn, d){
  if (!d || typeof d !== 'object') return;
  if (d.type === 'join'){
    const pid = String(d.pid || '').slice(0, 40); if (!pid) return;
    let p = H.players[pid];
    if (!p){
      if (H.phase === 'final'){ try { conn.send({type:'closed'}); } catch(e){} return; }
      p = H.players[pid] = {pid, name:String(d.name || '').trim().slice(0, 16) || 'Fábrica', st:null};
    }
    p.conn = conn; p.online = true; conn._pid = pid;
    if (H.phase === 'lobby'){ sendTo(p, {type:'lobby'}); renderHostLobby(); }
    else if (H.phase === 'run') sendTo(p, {type:'start', el:hostEl(), avg:avgPrice()});
    else if (H.phase === 'final') sendFinal(p);
  } else if (d.type === 'stat'){
    const p = H.players[conn._pid]; if (!p) return;
    const n = x => Number.isFinite(Number(x)) ? Number(x) : 0;
    p.st = {price:Math.min(5000, Math.max(0, n(d.price))), res:n(d.res), sold:n(d.sold), quit:n(d.quit), ups:n(d.ups), done:!!d.done};
  }
}
function addBots(){
  ['Robô Alfa', 'Robô Beta', 'Robô Gama'].forEach(n => {
    const pid = 'bot-' + rnd(6);
    H.players[pid] = {pid, name:n, bot:true, online:true, st:{price:ri(13, 18) * 100, res:0, sold:0, quit:0, ups:0}};
  });
  renderHostLobby();
}
function hostStart(){
  if (!hostPlayers().length) return;
  H.phase = 'run'; H.t0 = Date.now();
  hostPlayers().forEach(p => sendTo(p, {type:'start', el:0, avg:avgPrice()}));
  renderHostRun();
  clearInterval(H.timer); H.timer = setInterval(hostTick, 1000);
}
function hostTick(){
  const el = hostEl();
  hostPlayers().forEach(p => { if (p.bot){ p.st.res += ri(-1500, 4000); p.st.sold += ri(0, 2); p.st.quit += ri(0, 1); p.st.price = Math.max(1100, Math.min(2100, p.st.price + ri(-1, 1) * 50)); } });
  const rk = ranking(), avg = avgPrice();
  rk.forEach((p, i) => sendTo(p, {type:'tick', el, avg, rank:i + 1, n:rk.length}));
  if (el >= TOTAL_MS + 2500){ hostEnd(); return; }
  renderHostRun();
}
function hostEnd(){ clearInterval(H.timer); H.phase = 'final'; hostPlayers().forEach(sendFinal); renderPodium(); }
function awardsList(){
  const ps = hostPlayers().filter(p => p.st); if (!ps.length) return [];
  const top = f => ps.slice().sort((a, b) => f(b) - f(a))[0];
  const a = [];
  const r = top(p => p.st.res); a.push({pid:r.pid, ic:'💰', t:'Maior lucro', s:sgn(r.st.res)});
  const v = top(p => p.st.sold); a.push({pid:v.pid, ic:'🛒', t:'Campeão de vendas', s:v.st.sold + ' sensores vendidos'});
  const pr = ps.filter(p => p.st.res > 0); if (pr.length){ const m = pr.slice().sort((x, y) => y.st.price - x.st.price)[0]; a.push({pid:m.pid, ic:'💎', t:'Preço premium com lucro', s:brl(m.st.price) + ' por sensor'}); }
  const inv = top(p => p.st.ups * 1e6 + p.st.res); if (inv.st.ups > 0) a.push({pid:inv.pid, ic:'🏗️', t:'Maior investidor', s:inv.st.ups + ' melhorias compradas'});
  return a;
}
function sendFinal(p){
  const rk = ranking(), aw = awardsList();
  sendTo(p, {type:'end', pos:rk.indexOf(p) + 1, n:rk.length, podium:rk.slice(0, 3).map(x => ({name:x.name, res:x.st ? x.st.res : 0})), awards:aw.filter(a => a.pid === p.pid).map(a => ({ic:a.ic, t:a.t, s:a.s}))});
}
function renderHostLobby(){
  const link = baseUrl() + '?sala=' + H.code;
  const ps = hostPlayers();
  app.innerHTML = `
  <div class="host stack">
    <p class="kick">Mercado em Jogo · Sala ${esc(H.code)}</p>
    <h1>Cada um comanda uma fábrica. Quem lucra mais em 12 meses?</h1>
    ${location.protocol === 'file:' ? `<p class="warnbox">Arquivo aberto direto do computador: publique-o na internet para os celulares entrarem.</p>` : ''}
    <div class="row">
      <div class="card stack center" style="min-width:300px;align-items:center">
        <p class="kick">Aponte a câmera do celular</p><div id="qr"></div>
        <p class="note" style="word-break:break-all">${esc(link)}</p>
        <p>Código: <b style="font-size:30px;letter-spacing:4px">${esc(H.code)}</b></p>
      </div>
      <div class="card stack grow">
        <div class="row">
          <div class="deep grow center"><p style="font-size:34px">🏷️</p><b style="font-size:18px">Escolha o preço</b><p class="mute">Caro afasta clientes, barato corta a margem</p></div>
          <div class="deep grow center"><p style="font-size:34px">🚚</p><b style="font-size:18px">Invista</b><p class="mute">Caminhão, vendedor ou máquina nova</p></div>
          <div class="deep grow center"><p style="font-size:34px">❗</p><b style="font-size:18px">Decida os imprevistos</b><p class="mute">Duas opções, resultado na hora</p></div>
        </div>
        <h3>Fábricas no jogo (${ps.length})</h3>
        <div>${ps.map(p => `<span class="chip ${p.online ? 'ok' : ''}">${p.bot ? '🤖' : '🏭'} ${esc(p.name)}</span>`).join('') || '<span class="mute">Aguardando jogadores…</span>'}</div>
        <div class="row"><button class="btn big" id="go" ${ps.length ? '' : 'disabled'}>▶ Começar o jogo</button><button class="btn ghost" id="bots">+ 3 robôs (teste)</button></div>
      </div>
    </div>
  </div>`;
  $('go').onclick = hostStart; $('bots').onclick = addBots;
  const q = $('qr');
  if (window.QRCode){ try { new QRCode(q, {text:link, width:250, height:250, correctLevel:QRCode.CorrectLevel.M}); } catch(e){ q.style.display = 'none'; } } else q.style.display = 'none';
}
function renderHostRun(){
  const el = hostEl(), m = Math.min(G.months - 1, Math.floor(el / G.monthMs)), n = newsAt(m);
  const left = Math.max(0, TOTAL_MS - el), rk = ranking(), avg = avgPrice();
  const lots = hostPlayers().map(p => {
    const s = p.st || {res:0, price:G.pref, sold:0, quit:0};
    return `<div class="lot ${s.res < 0 ? 'neg' : ''}"><div class="bi">${p.bot ? '🤖' : '🏭'}</div><div class="nm">${esc(p.name)}</div><div class="val">${sgn(s.res)}</div><div class="sub">🏷️ ${brl(s.price)} · 🛒 ${s.sold} · 💸 ${s.quit}</div></div>`;
  }).join('');
  app.innerHTML = `
  <div class="host stack">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div><p class="kick">Sala ${esc(H.code)}</p><h1>Mês ${m + 1} de ${G.months}</h1></div>
      <div class="center"><p class="big-num">⏱ ${Math.floor(left / 60000)}:${String(Math.floor(left / 1000) % 60).padStart(2, '0')}</p><p class="mute">preço médio da cidade: ${avg ? brl(avg) : '—'}</p></div>
    </div>
    <div class="tbar" style="height:10px"><i style="width:${Math.min(100, 100 * el / TOTAL_MS)}%"></i></div>
    <div class="newsH"><span class="ic">${n.ic}</span><div><p class="kick">Notícia da cidade</p><h2>${esc(n.t)}</h2><p class="mute" style="font-size:18px">${esc(n.d)}</p></div></div>
    <div class="row" style="align-items:flex-start">
      <div class="card grow" style="flex:2"><h3 style="margin-bottom:10px">🗺️ Fábricas da cidade</h3><div class="lots">${lots}</div></div>
      <div class="card grow" style="flex:1"><h3>🏆 Ranking ao vivo</h3><ol class="rank">${rk.slice(0, 10).map((p, i) => `<li><span>${['🥇','🥈','🥉'][i] || (i + 1) + 'º'} ${esc(p.name)}</span><b class="${cls(p.st ? p.st.res : 0)}">${sgn(p.st ? p.st.res : 0)}</b></li>`).join('')}</ol>
        <button class="btn ghost" style="margin-top:12px;width:100%" id="endNow">Encerrar agora</button></div>
    </div>
  </div>`;
  $('endNow').onclick = () => { H.endClicks = (H.endClicks || 0) + 1; if (H.endClicks < 2){ toast('Clique de novo para encerrar.'); setTimeout(() => H.endClicks = 0, 3000); } else hostEnd(); };
}
function renderPodium(){
  const rk = ranking(), aw = awardsList();
  const col = [{bg:'#c0c7d4', h:230, i:1}, {bg:'#f0a35e', h:300, i:0}, {bg:'#b07a4f', h:180, i:2}];
  app.innerHTML = `
  <div class="host stack center">
    <p class="kick">Pódio final</p><h1>Quem melhor equilibrou preço, custos e investimentos</h1>
    <div class="podium">${col.map((c, k) => { const p = rk[c.i]; if (!p) return ''; return `<div class="stepP" style="background:${c.bg};height:${c.h}px;animation-delay:${[0.8, 1.6, 0][k]}s"><div class="pos">${c.i + 1}º</div><div class="nm">${esc(p.name)}</div><div>${sgn(p.st ? p.st.res : 0)}</div></div>`; }).join('')}</div>
    <div class="row" style="justify-content:center">${aw.map(a => `<div class="badge" style="min-width:230px;text-align:left"><span class="ic">${a.ic}</span><div><b>${esc(a.t)}</b><br>${esc(H.players[a.pid].name)}<br><span class="note">${esc(a.s)}</span></div></div>`).join('')}</div>
    <div class="card" style="text-align:left"><ol class="rank">${rk.map((p, i) => `<li><span>${i + 1}º ${esc(p.name)}</span><span>${p.st ? '🏷️ ' + brl(p.st.price) + ' · 🛒 ' + p.st.sold + ' · ' : ''}<b class="${cls(p.st ? p.st.res : 0)}">${sgn(p.st ? p.st.res : 0)}</b></span></li>`).join('')}</ol></div>
  </div>`;
  setTimeout(confetti, 1600);
}

function home(){
  app.innerHTML = `
  <div class="phone stack" style="margin-top:28px">
    <p class="kick">IFSP · Engenharia Econômica e Financeira</p>
    <h1 style="font-size:42px">🏭 Mercado em Jogo</h1>
    <p class="mute" style="font-size:17px">Comande uma fábrica de sensores: escolha o preço, invista e enfrente os imprevistos da cidade.</p>
    <div class="card stack"><h3>📽️ Sou o apresentador</h3><p class="mute">Abra no computador ligado ao projetor.</p><button class="btn big" id="h">Abrir sala</button></div>
    <div class="card stack"><h3>📱 Vou jogar</h3>
      <form id="j" class="row"><input type="text" id="code" maxlength="6" placeholder="Código da sala" style="flex:1;min-width:150px;text-transform:uppercase"><button class="btn" type="submit">Entrar</button></form></div>
  </div>`;
  $('h').onclick = startHost;
  $('j').onsubmit = e => { e.preventDefault(); const c = $('code').value.trim().replace(/[^A-Za-z0-9]/g, ''); if (c){ history.replaceState(null, '', '?sala=' + c.toUpperCase()); startPlayer(c); } };
}
(async () => {
  await loadLibs();
  const sala = new URLSearchParams(location.search).get('sala');
  if (sala && /^[A-Za-z0-9]{2,8}$/.test(sala)) startPlayer(sala);
  else home();
})();
window.addEventListener('beforeunload', e => { if (H.peer && H.phase === 'run'){ e.preventDefault(); e.returnValue = ''; } });
