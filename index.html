<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mercado em Jogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#14213d;--card:#1f2f52;--deep:#0f1a31;--line:#34446a;--ink:#f6f4ef;--mute:#aab3c5;--or:#e07a2c;--or2:#f0a35e;--blue:#5b9be0;--bad:#ff8a80;--good:#7fd6a4;--warn:#ffd36e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--navy);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;margin:0;line-height:1.1}
p{margin:0;line-height:1.45}
#app{max-width:1280px;margin:0 auto;padding:20px 16px 48px}
.kick{font-size:13px;letter-spacing:2px;font-weight:700;color:var(--or2);text-transform:uppercase}
.card{background:var(--card);border-radius:18px;padding:18px}
.deep{background:var(--deep);border-radius:14px;padding:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.grow{flex:1;min-width:240px}
.center{text-align:center}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 20px;font:700 17px Inter,sans-serif;cursor:pointer;background:var(--or);color:#14213d;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.big{font-size:20px;padding:18px 28px}
.btn.sm{padding:10px 0;font-size:16px;flex:1;background:var(--deep);color:var(--ink);border:2px solid var(--line)}
input[type=text]{width:100%;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--deep);color:var(--ink);font:600 20px Inter,sans-serif}
input:focus{outline:none;border-color:var(--or2)}
input[type=range]{width:100%;accent-color:var(--or);height:32px}
.mute{color:var(--mute)} .good{color:var(--good)} .bad{color:var(--bad)} .warnc{color:var(--warn)}
.big-num{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:40px}
.price{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:52px;text-align:center}
.opt{display:flex;gap:12px;align-items:center;padding:12px 14px;border:2px solid var(--line);border-radius:14px;cursor:pointer;background:var(--deep)}
.opt .ic{font-size:30px}
.opt.sel{border-color:var(--or2);background:#2a3a62}
.opt input{display:none}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--deep);border-radius:12px;padding:12px}
.kpi span{font-size:13px;color:var(--mute)}
.kpi b{display:block;font-size:21px;margin-top:4px}
.tag{display:inline-block;padding:6px 12px;border-radius:999px;font-weight:700;font-size:15px}
.thermo{position:relative;height:16px;border-radius:8px;background:linear-gradient(90deg,#c0392b 0%,#c0392b var(--a),#e0a13a var(--a),#e0a13a var(--b),#3fa66b var(--b),#3fa66b var(--c),#5b9be0 var(--c),#5b9be0 var(--d),#7d5bd0 var(--d))}
.thermo i{position:absolute;top:-6px;width:6px;height:28px;border-radius:3px;background:#fff;box-shadow:0 0 0 2px #14213d;transform:translateX(-3px)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:18px}
th{color:var(--mute);font-size:13px;letter-spacing:1px;text-transform:uppercase}
td.n,th.n{text-align:right}
.bar{height:10px;border-radius:5px;background:var(--good);min-width:2px}
.bar.neg{background:var(--bad)}
.timer{height:12px;background:var(--deep);border-radius:6px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--or);transition:width .25s linear}
.chip{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--deep);margin:4px;font-size:16px}
.chip.ok{background:#2c5a3f}
#qr{background:#fff;padding:14px;border-radius:14px;display:inline-block}
#qr img,#qr canvas{display:block}
.link{word-break:break-all;font-size:15px}
.tip{background:#2b2a1c;border-left:6px solid var(--warn);border-radius:12px;padding:12px 14px}
.lesson{background:#1c2b45;border-left:6px solid var(--blue);border-radius:12px;padding:14px 16px}
.badge{display:flex;gap:10px;align-items:center;background:var(--deep);border-radius:14px;padding:12px 14px}
.badge .ic{font-size:30px}
.wf{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:16px}
.wf>*:last-child{white-space:nowrap;margin-left:10px}
.wf.tot{font-weight:700;border-bottom:none;font-size:18px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.steps3 .deep{text-align:center}
.steps3 .ic{font-size:34px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:16px}
.step{width:220px;border-radius:16px 16px 0 0;display:flex;flex-direction:column;align-items:center;padding:16px 10px;text-align:center;animation:rise .9s ease-out both}
.step .pos{font-family:"Space Grotesk";font-size:56px;font-weight:700}
.step .nm{font-size:22px;font-weight:700;margin-top:6px;word-break:break-word}
.step .val{font-size:18px;margin-top:6px}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .5s ease-out both}
.confetti{position:fixed;top:-20px;font-size:24px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.host h1{font-size:54px}
.host .scen{font-size:24px}
.note{font-size:13px;color:var(--mute)}
.warnbox{background:#4a2a12;border-radius:12px;padding:12px 16px;color:#ffd7b3}
.ticker{font-size:15px;color:var(--mute);min-height:44px}
@media (max-width:640px){.host h1{font-size:34px}.big-num{font-size:30px}th,td{font-size:14px;padding:7px}.steps3{grid-template-columns:1fr}.price{font-size:44px}}
</style>
</head>
<body>
<div id="app"><p class="mute">Carregando…</p></div>

<script>
/* ===== Regras do jogo (ajuste aqui se quiser) ===== */
const CFG = {
  rounds: 5,          // número de rodadas
  secs: 90,           // segundos por rodada
  fixed: 10000,       // custos fixos por rodada (R$)
  varPct: 0.18,       // tributos (10%) + despesas variáveis (8%) sobre o preço
  pref: 1500,         // preço de referência do mercado (R$)
  perPlayer: 80       // tamanho do mercado: sensores por empresa por rodada
};
// beta = sensibilidade a preço; val = peso do valor demonstrado; out = força da alternativa do cliente; dem = tamanho do mercado
const SCEN = [
  {ic:"📈", t:"Mercado normal", d:"Clientes comparam preço e valor de forma equilibrada.", cv:800, beta:4, val:1, out:0.5, dem:1,
   tip:"Comece perto do preço de referência (R$ 1.500) e observe o que a concorrência faz.",
   lesson:"Preço é sinal: quem cobrou muito acima da referência perdeu clientes; quem cobrou muito abaixo deixou margem na mesa."},
  {ic:"🔩", t:"O aço subiu", d:"Seu custo variável passou de R$ 800 para R$ 920 por sensor.", cv:920, beta:4, val:1, out:0.5, dem:1,
   tip:"Seu piso subiu para R$ 1.122. Repassar parte do aumento ao preço protege a margem.",
   lesson:"Choque de custo desloca a oferta para a esquerda: todos repassam um pouco e o preço de equilíbrio sobe."},
  {ic:"🚢", t:"Chegou um importado barato", d:"Um concorrente estrangeiro entrou vendendo barato. Clientes ficaram mais sensíveis a preço.", cv:920, beta:6, val:0.6, out:1.1, dem:1,
   tip:"Demanda elástica: subir preço agora derruba vendas. Ações de valor rendem menos nesta rodada.",
   lesson:"Com substitutos baratos, a demanda fica elástica. Perder pouco também é boa gestão."},
  {ic:"🏭", t:"Cliente técnico exige TCO", d:"Grandes indústrias querem ver o custo total de propriedade antes de comprar.", cv:850, beta:2.5, val:1.8, out:0.5, dem:1,
   tip:"Valor demonstrado pesa muito. O estudo de TCO pode justificar um preço premium.",
   lesson:"Engenharia de vendas eleva o teto: provar economia ao cliente reduz a sensibilidade a preço."},
  {ic:"🏦", t:"Juros altos", d:"Crédito caro: muitos clientes adiaram compras e o mercado encolheu 30%.", cv:850, beta:5, val:1, out:0.5, dem:0.7,
   tip:"Mercado menor: fica mais difícil atingir o ponto de equilíbrio. Cuidado com gastos caros.",
   lesson:"Com menos volume, os custos fixos pesam mais: margem de contribuição e controle de gastos decidem o jogo."}
];
const ES = [
  {ic:"📄", n:"Só a tabela de preços", s:"Sem custo extra. Cliente decide quase só pelo preço.", c:0, v:0},
  {ic:"🤝", n:"Visita técnica", s:"Engenheiro configura a solução. +25% de atratividade.", c:2000, v:0.25},
  {ic:"📊", n:"Estudo de TCO + demo", s:"Prova economia e payback. +60% de atratividade.", c:5000, v:0.6}
];
const FACTS = [
  "💡 Margem de contribuição = preço − tributos e despesas variáveis − custo variável.",
  "💡 Ponto de equilíbrio = custos fixos ÷ margem de contribuição por unidade.",
  "💡 Abaixo do piso, cada venda aumenta o prejuízo, por mais clientes que você ganhe.",
  "💡 Demanda elástica: uma pequena alta de preço derruba muito as vendas.",
  "💡 Engenharia de vendas transforma especificação técnica em valor econômico para o cliente.",
  "💡 Dar 10% de desconto pode exigir 30% ou mais de volume para manter o mesmo lucro.",
  "💡 TCO = custo total de propriedade: preço + energia + manutenção ao longo da vida útil."
];

/* ===== Utilitários ===== */
const app = document.getElementById('app');
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => (n < 0 ? '−' : '') + 'R$ ' + Math.abs(Math.round(n)).toLocaleString('pt-BR');
const cls = n => n < 0 ? 'bad' : 'good';
const rnd = n => Math.random().toString(36).slice(2, 2 + n);
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const baseUrl = () => location.origin + location.pathname;
const piso = cv => cv / (1 - CFG.varPct);
const attr = (price, es, sc) => (1 + ES[es].v * sc.val) * Math.exp(-sc.beta * (price - CFG.pref) / CFG.pref);

function zone(p, sc){
  const pi = piso(sc.cv), mcp = (p * (1 - CFG.varPct) - sc.cv) / p;
  if (p < pi) return {ic:"🚨", t:"Prejuízo em cada venda", c:"#c0392b", fg:"#fff"};
  if (mcp < 0.2) return {ic:"⚠️", t:"Margem apertada", c:"#e0a13a", fg:"#14213d"};
  if (p <= CFG.pref * 1.15) return {ic:"✅", t:"Preço competitivo", c:"#3fa66b", fg:"#fff"};
  if (p <= CFG.pref * 1.35) return {ic:"💎", t:"Premium: precisa provar valor", c:"#5b9be0", fg:"#14213d"};
  return {ic:"🚀", t:"Muito caro: poucos clientes", c:"#7d5bd0", fg:"#fff"};
}

/* ===== Modelo de mercado ===== */
function market(decs, sc){
  const N = decs.length;
  const M = CFG.perPlayer * N * sc.dem;
  const A = decs.map(p => attr(p.price, p.es, sc));
  const sum = A.reduce((a, b) => a + b, 0) + sc.out * N;
  return decs.map((p, i) => {
    const q = Math.round(M * A[i] / sum);
    const mcu = p.price * (1 - CFG.varPct) - sc.cv;
    const lucro = q * mcu - CFG.fixed - ES[p.es].c;
    return {pid:p.pid, price:p.price, es:p.es, auto:!!p.auto, q, mcu, rev:q * p.price, mc:q * mcu, lucro, cv:sc.cv, esc:ES[p.es].c};
  });
}
// previsão para o jogador: concorrentes repetem a média da rodada anterior
function forecast(price, es, sc, ref){
  const n = Math.max(2, ref.n || 2);
  const M = CFG.perPlayer * n * sc.dem;
  const mine = attr(price, es, sc);
  const others = (n - 1) * (1 + (ref.v || 0) * sc.val) * Math.exp(-sc.beta * ((ref.avg || CFG.pref) - CFG.pref) / CFG.pref);
  const q = Math.round(M * mine / (mine + others + sc.out * n));
  const mcu = price * (1 - CFG.varPct) - sc.cv;
  return {q, lucro:q * mcu - CFG.fixed - ES[es].c};
}
function tip(r){
  if (r.mcu <= 0) return "🚨 Preço abaixo do piso: cada sensor vendido aumentou o prejuízo.";
  if (r.lucro < 0 && r.price > CFG.pref * 1.15) return "📉 Preço alto afastou clientes: o volume não cobriu os custos fixos.";
  if (r.lucro < 0) return "😬 A margem total não cobriu os custos fixos e a ação comercial.";
  if (r.mcu / r.price < 0.25) return "👍 Lucro positivo, mas com margem apertada: pouco espaço para imprevistos.";
  return "🎉 Margem e volume cobriram os custos fixos e geraram lucro!";
}
function badgesFor(res){
  const out = {}; const add = (pid, b) => (out[pid] = out[pid] || []).push(b);
  const by = (f) => res.slice().sort((a, b) => f(b) - f(a))[0];
  if (!res.length) return out;
  add(by(r => r.lucro).pid, {ic:"💰", t:"Maior lucro da rodada"});
  add(by(r => r.q).pid, {ic:"🧲", t:"Ímã de clientes"});
  add(by(r => r.mcu / r.price).pid, {ic:"🛡️", t:"Margem de ferro"});
  res.forEach(r => { if (r.es === 2 && r.lucro > 0) add(r.pid, {ic:"📊", t:"Valor provado: TCO com lucro"}); });
  res.forEach(r => { if (r.mcu <= 0) add(r.pid, {ic:"🚨", t:"Abaixo do piso"}); });
  return out;
}

/* ===== Carregar PeerJS e QR ===== */
function loadScript(src){return new Promise((ok, no) => {const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s);});}
async function loadLibs(){
  if (!window.Peer){
    for (const u of ["https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js","https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"]){
      try { await loadScript(u); if (window.Peer) break; } catch(e){}
    }
  }
  if (!window.QRCode){
    for (const u of ["https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js","https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"]){
      try { await loadScript(u); if (window.QRCode) break; } catch(e){}
    }
  }
}
function confetti(){
  const em = ['🎉','✨','🏆','💰','🎊'];
  for (let i = 0; i < 40; i++){
    const s = document.createElement('span'); s.className = 'confetti'; s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDuration = (2.5 + Math.random() * 2.5) + 's'; s.style.animationDelay = Math.random() * 1.5 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 7000);
  }
}

/* ===================================================== */
/* ===================  APRESENTADOR  ================== */
/* ===================================================== */
const H = {code:null, peer:null, players:{}, round:-1, phase:'lobby', timer:null, endsAt:0, results:[], badges:{}, ref:{avg:CFG.pref, v:0, n:2}};

function hostPlayers(){ return Object.values(H.players); }
function ranking(){ return hostPlayers().slice().sort((a, b) => b.total - a.total); }
function sendTo(p, msg){ if (p.conn && p.conn.open){ try { p.conn.send(msg); } catch(e){} } }

function startHost(){
  if (!window.Peer){ app.innerHTML = `<div class="card stack"><h2>Não foi possível carregar a conexão</h2><p class="mute">Verifique a internet do computador e recarregue a página.</p></div>`; return; }
  H.code = rnd(4).toUpperCase();
  app.innerHTML = `<div class="card"><p>Abrindo a sala…</p></div>`;
  try { H.peer = new Peer('mercado-jogo-' + H.code.toLowerCase()); } catch(e){ blockedMsg(); return; }
  const myPeer = H.peer;
  setTimeout(() => { if (H.peer === myPeer && !myPeer.open && H.phase === 'lobby') blockedMsg(); }, 12000);
  H.peer.on('open', () => renderLobby());
  H.peer.on('connection', conn => {
    conn.on('data', d => hostData(conn, d));
    conn.on('close', () => { const p = H.players[conn._pid]; if (p && p.conn === conn){ p.online = false; refreshHost(); } });
  });
  H.peer.on('disconnected', () => { try { H.peer.reconnect(); } catch(e){} });
  H.peer.on('error', e => {
    if (e.type === 'unavailable-id'){ H.peer.destroy(); startHost(); return; }
    if (H.phase === 'lobby' && !H.peer.open) app.innerHTML = `<div class="card stack"><h2>Erro ao abrir a sala</h2><p class="mute">${esc(e.type)}. Verifique a internet e recarregue.</p></div>`;
  });
}
function blockedMsg(){
  app.innerHTML = `<div class="card stack" style="max-width:640px;margin:40px auto">
    <h2>Não consegui abrir a sala</h2>
    <p>Este navegador ou esta rede bloqueou a conexão do jogo. Isso acontece em pré-visualizações (como a do app do Claude) ou em redes que bloqueiam conexões diretas.</p>
    <p class="mute">Abra o endereço publicado no Chrome, Edge ou Safari. Se a rede bloquear, teste pelo 4G.</p>
    <button class="btn" onclick="location.reload()">Tentar de novo</button></div>`;
}

function hostData(conn, d){
  if (!d || typeof d !== 'object') return;
  if (d.type === 'join'){
    const pid = String(d.pid || '').slice(0, 40); if (!pid) return;
    let p = H.players[pid];
    if (!p){
      if (H.phase === 'final') { try { conn.send({type:'closed'}); } catch(e){} return; }
      const name = String(d.name || '').trim().slice(0, 24) || 'Empresa';
      p = H.players[pid] = {pid, name, total:0, last:{price:CFG.pref, es:0}, dec:null, hist:[], prevPos:0, badges:[]};
    }
    p.conn = conn; p.online = true; conn._pid = pid;
    sendTo(p, {type:'welcome', name:p.name});
    syncPlayer(p); refreshHost();
  } else if (d.type === 'decision'){
    const p = H.players[conn._pid];
    if (!p || H.phase !== 'round' || d.round !== H.round) return;
    let price = Number(d.price); if (!isFinite(price)) return;
    price = Math.min(4000, Math.max(500, Math.round(price)));
    const es = [0, 1, 2].includes(d.es) ? d.es : 0;
    p.dec = {price, es};
    sendTo(p, {type:'ack', price, es});
    refreshHost();
    if (hostPlayers().every(x => x.dec)) endRound();
  }
}

function syncPlayer(p){
  if (H.phase === 'lobby') sendTo(p, {type:'lobby'});
  else if (H.phase === 'round'){
    const secs = Math.max(0, Math.round((H.endsAt - Date.now()) / 1000));
    sendTo(p, {type:'round', round:H.round, secs, last:p.last, done:p.dec, ref:H.ref});
  } else if (H.phase === 'results'){
    const r = H.results.find(x => x.pid === p.pid);
    const rk = ranking(); const pos = rk.indexOf(p) + 1;
    if (r) sendTo(p, {type:'result', round:H.round, r, pos, prevPos:p.prevPos, n:rk.length, total:p.total, badges:H.badges[p.pid] || [], last:H.round === CFG.rounds - 1});
    else sendTo(p, {type:'lobby'});
  } else if (H.phase === 'final'){
    const rk = ranking(); const pos = rk.indexOf(p) + 1;
    sendTo(p, {type:'final', pos, n:rk.length, total:p.total, podium:rk.slice(0, 3).map(x => ({name:x.name, total:x.total})), awards:awardsFor(p)});
  }
}

function addBots(){
  ['Robô Alfa', 'Robô Beta', 'Robô Gama'].forEach(n => {
    const pid = 'bot-' + rnd(6);
    H.players[pid] = {pid, name:n, bot:true, online:true, total:0, last:{price:CFG.pref, es:0}, dec:null, hist:[], prevPos:0, badges:[]};
  });
  refreshHost();
}

function startRound(){
  if (!hostPlayers().length) return;
  H.round++; H.phase = 'round';
  const rk = ranking(); hostPlayers().forEach(p => p.prevPos = H.round > 0 ? rk.indexOf(p) + 1 : 0);
  H.ref.n = Math.max(2, hostPlayers().length);
  hostPlayers().forEach(p => {
    p.dec = null;
    if (p.bot){ const sc = SCEN[H.round]; p.dec = {price:Math.round((piso(sc.cv) * 1.25 + Math.random() * 700) / 10) * 10, es:Math.floor(Math.random() * 3)}; }
  });
  H.endsAt = Date.now() + CFG.secs * 1000;
  hostPlayers().forEach(syncPlayer);
  renderHostRound();
  clearInterval(H.timer);
  H.timer = setInterval(() => { if (Date.now() >= H.endsAt) endRound(); else updateHostTimer(); }, 250);
}

function endRound(){
  if (H.phase !== 'round') return;
  clearInterval(H.timer);
  const list = hostPlayers();
  const decs = list.map(p => { const d = p.dec || p.last; p.last = {price:d.price, es:d.es}; return {pid:p.pid, price:d.price, es:d.es, auto:!p.dec}; });
  H.results = market(decs, SCEN[H.round]);
  H.results.forEach(r => { const p = H.players[r.pid]; p.total += r.lucro; p.hist.push(r); });
  H.badges = badgesFor(H.results);
  Object.entries(H.badges).forEach(([pid, bs]) => { if (H.players[pid]) H.players[pid].badges.push(...bs); });
  H.ref = {avg:decs.reduce((a, x) => a + x.price, 0) / decs.length, v:decs.reduce((a, x) => a + ES[x.es].v, 0) / decs.length, n:Math.max(2, decs.length)};
  H.phase = 'results';
  list.forEach(syncPlayer);
  renderHostResults();
}

function awardsList(){
  const ps = hostPlayers().filter(p => p.hist.length); if (!ps.length) return [];
  const top = f => ps.slice().sort((a, b) => f(b) - f(a))[0];
  const vol = top(p => p.hist.reduce((a, r) => a + r.q, 0));
  const mar = top(p => p.hist.reduce((a, r) => a + r.mcu / r.price, 0) / p.hist.length);
  const con = top(p => p.hist.filter(r => r.lucro > 0).length * 1e6 + p.total);
  const eng = top(p => p.hist.filter(r => r.es > 0 && r.lucro > 0).length * 1e6 + p.total);
  return [
    {pid:vol.pid, ic:"🧲", t:"Rei do volume", s:vol.hist.reduce((a, r) => a + r.q, 0) + " sensores vendidos"},
    {pid:mar.pid, ic:"🛡️", t:"Margem de ouro", s:"maior margem de contribuição média"},
    {pid:con.pid, ic:"📆", t:"Consistência", s:con.hist.filter(r => r.lucro > 0).length + " de " + con.hist.length + " rodadas com lucro"},
    {pid:eng.pid, ic:"🤝", t:"Engenharia de vendas", s:"mais ações comerciais que deram lucro"}
  ];
}
function awardsFor(p){ return awardsList().filter(a => a.pid === p.pid).map(a => ({ic:a.ic, t:a.t, s:a.s})); }

function showPodium(){ H.phase = 'final'; hostPlayers().forEach(syncPlayer); renderPodium(); }

function resetGame(){
  H.round = -1; H.phase = 'lobby'; H.results = []; H.badges = {}; H.ref = {avg:CFG.pref, v:0, n:2};
  hostPlayers().forEach(p => { if (p.bot) delete H.players[p.pid]; else { p.total = 0; p.hist = []; p.dec = null; p.badges = []; p.prevPos = 0; p.last = {price:CFG.pref, es:0}; } });
  hostPlayers().forEach(syncPlayer); renderLobby();
}

const P = {code:null, pid:null, name:'', peer:null, conn:null, tick:null, fact:null, round:-1, tries:0};

function startPlayer(code){
  P.code = code.toUpperCase();
  P.pid = store.get('mj_pid') || ('p-' + rnd(10)); store.set('mj_pid', P.pid);
  const saved = store.get('mj_name') || '';
  app.innerHTML = `
  <div class="stack" style="max-width:520px;margin:0 auto">
    <p class="kick">Mercado em Jogo · Sala ${esc(P.code)}</p>
    <h2 style="font-size:32px">🏭 Dê um nome à sua fábrica</h2>
    <form id="f" class="stack">
      <input type="text" id="nm" maxlength="24" placeholder="Ex.: Sensores do João" value="${esc(saved)}" autocomplete="off">
      <button class="btn big" type="submit">Entrar no jogo</button>
    </form>
    <p class="mute">Você vai disputar clientes com as outras empresas da sala. Vence quem terminar com mais lucro.</p>
  </div>`;
  $('f').onsubmit = e => {
    e.preventDefault();
    const n = $('nm').value.trim(); if (!n) { $('nm').focus(); return; }
    P.name = n.slice(0, 24); store.set('mj_name', P.name);
    playerWait('Conectando à sala…'); connect();
  };
}

function connect(){
  if (!window.Peer){ playerWait('Não foi possível carregar a conexão. Verifique a internet e recarregue a página.'); return; }
  try { if (P.peer) P.peer.destroy(); } catch(e){}
  try { P.peer = new Peer(); } catch(e){ blockedMsg(); return; }
  P.peer.on('open', () => {
    const c = P.peer.connect('mercado-jogo-' + P.code.toLowerCase(), {reliable:true});
    P.conn = c;
    c.on('open', () => { P.tries = 0; c.send({type:'join', pid:P.pid, name:P.name}); });
    c.on('data', playerData);
    c.on('close', () => { if (P.conn === c) retry(); });
  });
  P.peer.on('error', e => {
    if (e.type === 'peer-unavailable') { playerWait('Sala não encontrada. Confira o código ou peça para o apresentador abrir a sala. Tentando de novo…'); setTimeout(connect, 4000); }
    else retry();
  });
}
function retry(){ P.tries++; playerWait('Conexão perdida. Reconectando…'); setTimeout(connect, Math.min(8000, 1500 * P.tries)); }

function playerData(d){
  if (!d || typeof d !== 'object') return;
  if (d.type === 'welcome' || d.type === 'lobby') renderTutorial();
  else if (d.type === 'round'){ P.round = d.round; if (d.done) playerSent(d.done); else renderDecide(d.round, d.secs, d.last, d.ref || {}); }
  else if (d.type === 'ack') playerSent(d);
  else if (d.type === 'result') renderResult(d);
  else if (d.type === 'final') renderFinal(d);
  else if (d.type === 'closed') playerWait('Este jogo já terminou. Aguarde o apresentador iniciar um novo.');
}

  upd(); P.tick = setInterval(upd, 500);

function renderDecide(round, secs, last, ref){
  stopTimers();
  const sc = SCEN[round];
  let price = (last && last.price) || CFG.pref, es = (last && last.es) || 0;
  const lo = 800, hi = 2600;
  const pct = v => Math.max(0, Math.min(100, 100 * (v - lo) / (hi - lo)));
  const pi = piso(sc.cv);
  const zA = pct(pi), zB = pct(sc.cv / (1 - CFG.varPct - 0.2)), zC = pct(CFG.pref * 1.15), zD = pct(CFG.pref * 1.35);
  app.innerHTML = `
  <div class="stack" style="max-width:560px;margin:0 auto">
    <div class="row" style="justify-content:space-between;align-items:center"><p class="kick">Rodada ${round + 1} de ${CFG.rounds}</p><span class="big-num" id="pt" style="font-size:26px"></span></div>
    <div class="card stack"><h2>${sc.ic} ${esc(sc.t)}</h2><p class="mute">${esc(sc.d)}</p>
      <div class="tip"><b>💡 Dica:</b> ${esc(sc.tip)}</div></div>
    <div class="card stack">
      <h3>🏷️ 1. Preço do sensor</h3>
      <div class="price" id="pv"></div>
      <div class="center"><span class="tag" id="zt"></span></div>
      <div class="thermo" style="--a:${zA}%;--b:${zB}%;--c:${zC}%;--d:${zD}%"><i id="mk"></i></div>
      <div class="row note" style="justify-content:space-between"><span>R$ 800</span><span>piso ${brl(pi)}</span><span>ref. ${brl(CFG.pref)}</span><span>R$ 2.600</span></div>
      <input type="range" id="pr" min="${lo}" max="${hi}" step="10" value="${price}">
      <div class="row" style="gap:8px"><button class="btn sm" data-d="-100">−100</button><button class="btn sm" data-d="-10">−10</button><button class="btn sm" data-d="10">+10</button><button class="btn sm" data-d="100">+100</button></div>
    </div>
    <div class="card stack">
      <h3>🤝 2. Ação de engenharia de vendas</h3>
      ${ES.map((o, i) => `<label class="opt ${i === es ? 'sel' : ''}"><input type="radio" name="es" value="${i}" ${i === es ? 'checked' : ''}><span class="ic">${o.ic}</span><span style="flex:1"><b>${esc(o.n)}</b> <span class="mute">· ${o.c ? brl(o.c) : 'grátis'}</span><br><span class="note">${esc(o.s)}</span></span></label>`).join('')}
    </div>
    <div class="card stack">
      <h3>🔮 3. Previsão da sua decisão</h3>
      <div class="kpis" id="calc"></div>
      <p class="note">Estimativa se os concorrentes repetirem o preço médio da rodada anterior (${brl(ref.avg || CFG.pref)}). O resultado real depende do que eles fizerem!</p>
    </div>
    <button class="btn big" id="send">✅ Enviar decisão</button>
    <p class="note center" id="msg"></p>
  </div>`;
  const pr = $('pr');
  const calc = () => {
    const p = Number(pr.value); price = p;
    const z = zone(p, sc);
    $('pv').textContent = brl(p);
    $('zt').textContent = z.ic + ' ' + z.t; $('zt').style.background = z.c; $('zt').style.color = z.fg;
    $('mk').style.left = pct(p) + '%';
    const mcu = p * (1 - CFG.varPct) - sc.cv; const fx = CFG.fixed + ES[es].c;
    const pe = mcu > 0 ? Math.ceil(fx / mcu) : null;
    const f = forecast(p, es, sc, ref);
    $('calc').innerHTML = `
      <div class="kpi"><span>Margem por sensor</span><b class="${cls(mcu)}">${brl(mcu)} <span class="note">(${Math.round(100 * mcu / p)}%)</span></b></div>
      <div class="kpi"><span>Precisa vender (equilíbrio)</span><b>${pe ? pe + ' sensores' : '—'}</b></div>
      <div class="kpi"><span>Vendas previstas</span><b>≈ ${f.q} sensores</b></div>
      <div class="kpi"><span>Lucro previsto</span><b class="${cls(f.lucro)}">≈ ${brl(f.lucro)}</b></div>`;
  };
  pr.oninput = calc;
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { pr.value = Math.max(lo, Math.min(hi, Number(pr.value) + Number(b.dataset.d))); calc(); });
  document.querySelectorAll('input[name=es]').forEach(r => r.onchange = () => {
    es = Number(r.value);
    document.querySelectorAll('.opt').forEach((l, i) => l.classList.toggle('sel', i === es));
    calc();
  });
  $('send').onclick = () => {
    if (P.conn && P.conn.open){ P.conn.send({type:'decision', round, price:Number(pr.value), es}); $('send').disabled = true; $('send').textContent = 'Enviando…'; }
    else $('msg').textContent = 'Sem conexão no momento. Aguarde alguns segundos e tente de novo.';
  };
  calc(); countdown(secs);
}

function renderResult(d){
  stopTimers();
  const r = d.r;
  const mv = d.prevPos ? d.prevPos - d.pos : 0;
  const face = r.lucro > 15000 ? '🤑' : r.lucro > 0 ? '😄' : r.lucro > -5000 ? '😬' : '😱';
  const trib = r.rev * CFG.varPct, cvt = r.q * r.cv;
  app.innerHTML = `
  <div class="stack" style="max-width:560px;margin:0 auto">
    <p class="kick">Resultado · Rodada ${d.round + 1} de ${CFG.rounds}</p>
    <div class="card stack center pop">
      <p style="font-size:52px">${face}</p>
      <p class="big-num ${cls(r.lucro)}">${brl(r.lucro)}</p>
      <p class="mute">lucro nesta rodada</p>
      <p style="font-size:20px"><b>${d.pos}º</b> de ${d.n} ${mv > 0 ? '<span class="good">▲ subiu ' + mv + '</span>' : mv < 0 ? '<span class="bad">▼ caiu ' + (-mv) + '</span>' : ''} · acumulado <b class="${cls(d.total)}">${brl(d.total)}</b></p>
    </div>
    ${d.badges.length ? `<div class="stack">${d.badges.map(b => `<div class="badge pop"><span class="ic">${b.ic}</span><b>${esc(b.t)}</b></div>`).join('')}</div>` : ''}
    <div class="card stack">
      <h3>De onde veio seu resultado</h3>
      <div>
        <div class="wf"><span>🧲 ${r.q} sensores × ${brl(r.price)}</span><b>${brl(r.rev)}</b></div>
        <div class="wf"><span>(−) Tributos e despesas (18%)</span><span class="bad">${brl(-trib)}</span></div>
        <div class="wf"><span>(−) Custo variável (${brl(r.cv)}/un.)</span><span class="bad">${brl(-cvt)}</span></div>
        <div class="wf tot"><span>= Margem de contribuição</span><span class="${cls(r.mc)}">${brl(r.mc)}</span></div>
        <div class="wf"><span>(−) Custos fixos</span><span class="bad">${brl(-CFG.fixed)}</span></div>
        <div class="wf"><span>(−) Ação de vendas ${ES[r.es].ic}</span><span class="bad">${brl(-r.esc)}</span></div>
        <div class="wf tot"><span>= Lucro da rodada</span><span class="${cls(r.lucro)}">${brl(r.lucro)}</span></div>
      </div>
      <div class="tip">${esc(tip(r))}</div>
      ${r.auto ? '<p class="note">Você não enviou a tempo: repetimos sua decisão anterior.</p>' : ''}
    </div>
    <p class="mute center">${d.last ? '🏆 Olhe o telão: o pódio vem aí!' : '⏳ Aguarde a próxima rodada.'}</p>
  </div>`;
  if (r.lucro > 0 && d.pos === 1) confetti();
}

function renderFinal(d){
  stopTimers();
  const medal = ['🥇', '🥈', '🥉'][d.pos - 1] || '🏁';
  app.innerHTML = `
  <div class="stack center" style="max-width:560px;margin:0 auto">
    <p class="kick">Fim de jogo</p>
    <p style="font-size:80px" class="pop">${medal}</p>
    <h2 style="font-size:36px">${d.pos}º lugar de ${d.n}</h2>
    <p>Lucro acumulado: <b class="${cls(d.total)}">${brl(d.total)}</b></p>
    ${d.awards.length ? `<div class="stack">${d.awards.map(a => `<div class="badge pop" style="text-align:left"><span class="ic">${a.ic}</span><div><b>${esc(a.t)}</b><br><span class="note">${esc(a.s)}</span></div></div>`).join('')}</div>` : ''}
    <div class="card stack" style="text-align:left"><h3>Pódio</h3>
      ${d.podium.map((p, i) => `<p style="font-size:18px">${['🥇', '🥈', '🥉'][i]} <b>${esc(p.name)}</b> · ${brl(p.total)}</p>`).join('')}
    </div>
    <p class="mute">Obrigado por jogar! 👏</p>
  </div>`;
  if (d.pos <= 3) confetti();
}

/* ======================  INÍCIO  ===================== */
/* ===================================================== */
function home(){
  app.innerHTML = `
  <div class="stack" style="max-width:640px;margin:32px auto">
    <p class="kick">IFSP · Engenharia Econômica e Financeira</p>
    <h1 style="font-size:46px">🏭 Mercado em Jogo</h1>
    <p class="mute" style="font-size:18px">Cada participante comanda uma fábrica de sensores industriais, define preço e ação de vendas, disputa clientes e tenta terminar com o maior lucro.</p>
    <div class="card stack">
      <h3>📽️ Sou o apresentador</h3>
      <p class="mute">Abra no computador ligado ao projetor.</p>
      <button class="btn big" id="h">Abrir sala</button>
    </div>
    <div class="card stack">
      <h3>📱 Vou jogar</h3>
      <form id="j" class="row"><input type="text" id="code" maxlength="6" placeholder="Código da sala" style="flex:1;min-width:160px;text-transform:uppercase"><button class="btn" type="submit">Entrar</button></form>
    </div>
  </div>`;
  $('h').onclick = startHost;
  $('j').onsubmit = e => { e.preventDefault(); const c = $('code').value.trim().replace(/[^A-Za-z0-9]/g, ''); if (c) { history.replaceState(null, '', '?sala=' + c.toUpperCase()); startPlayer(c); } };
}

(async () => {
  await loadLibs();
  const sala = new URLSearchParams(location.search).get('sala');
  if (sala && /^[A-Za-z0-9]{2,8}$/.test(sala)) startPlayer(sala);
  else home();
})();

window.addEventListener('beforeunload', e => { if (H.peer && H.phase !== 'lobby' && H.phase !== 'final'){ e.preventDefault(); e.returnValue = ''; } });
</script>
