<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mercado em Jogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#14213d;--card:#1f2f52;--deep:#0f1a31;--line:#34446a;--ink:#f6f4ef;--mute:#aab3c5;--or:#e07a2c;--or2:#f0a35e;--blue:#5b9be0;--bad:#ff8a80;--good:#7fd6a4;--warn:#ffd36e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--navy);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;margin:0;line-height:1.1}
p{margin:0;line-height:1.45}
button{font-family:inherit}
#app{max-width:1280px;margin:0 auto;padding:16px 14px 40px}
.phone{max-width:480px;margin:0 auto}
.kick{font-size:12px;letter-spacing:2px;font-weight:700;color:var(--or2);text-transform:uppercase}
.card{background:var(--card);border-radius:18px;padding:16px}
.deep{background:var(--deep);border-radius:14px;padding:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.grow{flex:1;min-width:220px}
.center{text-align:center}
.mute{color:var(--mute)} .good{color:var(--good)} .bad{color:var(--bad)}
.note{font-size:12px;color:var(--mute)}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font:700 16px Inter,sans-serif;cursor:pointer;background:var(--or);color:#14213d}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.dark{background:var(--deep);color:var(--ink);border:2px solid var(--line)}
.btn.big{font-size:19px;padding:16px 24px}
.btn.sm{padding:8px 12px;font-size:14px}
input[type=text]{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--deep);color:var(--ink);font:600 19px Inter,sans-serif}
input:focus{outline:none;border-color:var(--or2)}
.big-num{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:38px}
/* HUD */
.hud{display:grid;grid-template-columns:1.3fr .9fr 1.3fr .8fr;gap:6px;position:sticky;top:0;z-index:5;background:var(--navy);padding:6px 0}
.hc{background:var(--deep);border-radius:10px;padding:6px 8px}
.hc span{display:block;font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.hc b{font-size:15px;white-space:nowrap}
.tbar{height:6px;background:var(--deep);border-radius:3px;overflow:hidden;margin:4px 0 8px}
.tbar i{display:block;height:100%;background:var(--or);width:0}
.macro{display:flex;gap:10px;align-items:center;background:#1c2b45;border-left:5px solid var(--blue);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:6px}
.macro .ic{font-size:24px}
.advisor{display:flex;gap:8px;align-items:flex-start;background:#2b2a1c;border-left:5px solid var(--warn);border-radius:10px;padding:8px 10px;font-size:13px;min-height:40px;margin-bottom:8px}
.mapwrap{border-radius:18px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#map{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none}
.bld{cursor:pointer}
.bld:active .halo{fill:rgba(255,255,255,.55)}
.lbl{font:700 9px Inter,sans-serif;fill:#14213d}
.evbar{display:flex;gap:10px;align-items:center;background:var(--or);color:#14213d;border-radius:12px;padding:10px 12px;margin-top:8px;font-weight:700;cursor:pointer;animation:pulse 1.2s infinite}
.evbar .ic{font-size:28px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,163,94,.6)}50%{box-shadow:0 0 0 8px rgba(240,163,94,0)}}
.hidden{display:none!important}
.dock{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.step{background:var(--card);border-radius:14px;padding:10px;text-align:center}
.step>span{font-size:12px;color:var(--mute)}
.sr{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:4px 0}
.sr b{font-family:"Space Grotesk",Inter,sans-serif;font-size:19px;white-space:nowrap}
.sr button{flex:none;width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:var(--deep);color:var(--ink);font-size:22px;font-weight:700;cursor:pointer}
.tag{display:inline-block;padding:3px 8px;border-radius:999px;font-weight:700;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.stats div{background:var(--deep);border-radius:10px;padding:6px;text-align:center;font-size:10px;color:var(--mute)}
.stats b{display:block;font-size:15px;color:var(--ink)}
/* Sheet */
.sheet{position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--card);width:100%;max-width:480px;max-height:82vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 26px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv b{white-space:nowrap}
.opt{display:block;width:100%;text-align:left;background:var(--deep);border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;font:600 15px Inter,sans-serif;cursor:pointer;margin-top:8px}
.opt:active{border-color:var(--or2)}
.tip{background:#2b2a1c;border-left:5px solid var(--warn);border-radius:10px;padding:10px;font-size:13px}
.seg{display:flex;gap:6px}
.seg button{flex:1}
.seg button.on{background:var(--or);color:#14213d;border-color:var(--or)}
/* toasts */
#toasts{position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;width:min(460px,94vw);pointer-events:none}
.toast{background:rgba(11,20,38,.94);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:up .25s ease-out;pointer-events:none}
.toast.rep{border-color:var(--or2)}
.wf{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.wf b{white-space:nowrap;margin-left:8px}
/* host */
.host h1{font-size:48px}
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.lot{background:#6fa83d;border-radius:14px;padding:10px;color:#14213d;position:relative;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.lot .bi{font-size:44px;line-height:1}
.lot .nm{font-weight:800;font-size:19px;margin-top:4px;word-break:break-word}
.lot .val{font-weight:800;font-size:24px}
.lot .sub{font-size:14px}
.lot.neg{background:#c26a4a}
.rank li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:17px}
.rank{list-style:none;margin:0;padding:0}
.chip{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--deep);margin:4px;font-size:15px}
.chip.ok{background:#2c5a3f}
#qr{background:#fff;padding:12px;border-radius:14px;display:inline-block}
#qr img,#qr canvas{display:block}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:16px}
.stepP{width:210px;border-radius:16px 16px 0 0;display:flex;flex-direction:column;align-items:center;padding:16px 10px;text-align:center;animation:rise .9s ease-out both;color:#14213d}
.stepP .pos{font-family:"Space Grotesk";font-size:52px;font-weight:700}
.stepP .nm{font-size:21px;font-weight:700;margin-top:6px;word-break:break-word}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.badge{display:flex;gap:10px;align-items:center;background:var(--deep);border-radius:14px;padding:12px 14px}
.badge .ic{font-size:28px}
.confetti{position:fixed;top:-20px;font-size:24px;pointer-events:none;animation:fall linear forwards;z-index:40}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.warnbox{background:#4a2a12;border-radius:12px;padding:12px 16px;color:#ffd7b3}
.news{background:#1c2b45;border-left:6px solid var(--blue);border-radius:14px;padding:14px 18px;display:flex;gap:14px;align-items:center}
.news .ic{font-size:44px}
@media (max-width:640px){.host h1{font-size:32px}}
</style>
</head>
<body>
<div id="app"><p class="mute">Carregando…</p></div>
<div id="toasts"></div>

<script>
/* =====================================================================
   CONFIGURAÇÃO DO JOGO (ajuste aqui)
   ===================================================================== */
const G = {
  months: 12,          // meses do jogo
  monthMs: 50000,      // duração de cada mês (50 s → 12 meses = 10 min)
  cycles: 10,          // ciclos por mês (1 ciclo = 5 s)
  startCash: 60000,    // caixa inicial
  startRaw: 40,        // matéria-prima inicial (unidades)
  startFG: 20,         // sensores prontos no estoque
  convCost: 200,       // custo de transformação por sensor (energia, mão de obra)
  varPct: 0.18,        // tributos (10%) + despesas variáveis (8%) sobre a receita
  admin: 12000,        // despesas fixas mensais (aluguel, administração)
  engCost: 3000,       // salário mensal de um engenheiro de vendas
  truckCost: 1500,     // custo mensal de cada caminhão
  truckPrice: 18000,   // preço de compra de um caminhão
  capUpCost: 30000,    // ampliação da fábrica
  capUp: 40,           // +sensores/mês por ampliação
  baseDemand: 60,      // clientes por mês no preço de referência
  pref: 1500,          // preço de referência do mercado
  capStart: 80,        // capacidade inicial (sensores/mês)
  overdraft: 0.08      // juros do cheque especial ao mês
};
const CYCLE_MS = G.monthMs / G.cycles;
const TOTAL_MS = G.months * G.monthMs;
// Estoques valem menos que o custo se ficarem parados (valor de liquidação no fim do jogo)
const STOCK_VALUE = 0.6;
const INIT = G.startCash + (G.startRaw * 600 + G.startFG * (600 + G.convCost)) * STOCK_VALUE;

// Economia da cidade: muda em alguns meses (igual para todos os jogadores)
const MACRO = [
  {m:0,  ic:"📈", t:"Mercado aberto",          d:"Clientes comparam preço e valor. Encontre o seu ponto de equilíbrio.",                 beta:3,   dem:1,    mp:600, rate:0.03, val:1,   shift:0},
  {m:2,  ic:"🔩", t:"O aço subiu 15%",         d:"Matéria-prima passa de R$ 600 para R$ 690. Repassar ao preço ou absorver na margem?",   beta:3,   dem:1,    mp:690, rate:0.03, val:1,   shift:0},
  {m:4,  ic:"🏦", t:"Juros altos",             d:"Crédito caro: clientes adiam compras (−20%) e o banco cobra 6% ao mês.",                beta:3,   dem:0.8,  mp:690, rate:0.06, val:1,   shift:0},
  {m:6,  ic:"🚢", t:"Chegou um importado barato", d:"Concorrente estrangeiro vende a R$ 1.350. Clientes ficaram mais sensíveis a preço.", beta:5,   dem:0.9,  mp:650, rate:0.05, val:0.7, shift:-150},
  {m:8,  ic:"🏭", t:"Indústria aquecida",      d:"Fábricas da região cresceram: demanda +30%. Valor demonstrado pesa mais.",              beta:3,   dem:1.3,  mp:650, rate:0.04, val:1.2, shift:0},
  {m:10, ic:"🎄", t:"Pedidos de fim de ano",   d:"Clientes garantem estoque antes das férias: demanda +15%.",                             beta:2.5, dem:1.15, mp:620, rate:0.04, val:1.2, shift:0}
];
const macroAt = m => { let c = MACRO[0]; for (const e of MACRO) if (e.m <= m) c = e; return c; };

// Mapa (coordenadas no SVG 360 × 310)
const AV = 160; // avenida principal (y)
const B = {
  sup:{x:42, y:52,  ic:"⛏️", n:"Fornecedor"},
  arm:{x:108,y:108, ic:"📦", n:"Armazém"},
  fab:{x:182,y:98,  ic:"🏭", n:"Sua fábrica", big:true},
  com:{x:258,y:104, ic:"🏢", n:"Comercial"},
  gar:{x:108,y:214, ic:"🚚", n:"Garagem"},
  ban:{x:258,y:216, ic:"🏦", n:"Banco"},
  c0: {x:322,y:48,  ic:"🏘️", n:"Bairro", cli:true},
  c1: {x:330,y:232, ic:"🏬", n:"Comércio", cli:true},
  c2: {x:200,y:278, ic:"🏗️", n:"Construtora", cli:true},
  c3: {x:40, y:270, ic:"🏭", n:"Indústria", cli:true}
};
const CLIENTS = ["c0","c1","c2","c3"];
const TREES = [[20,140],[76,40],[150,40],[228,46],[296,140],[60,188],[150,250],[300,290],[340,110],[96,290],[226,250],[20,214]];

/* =====================================================================
   UTILITÁRIOS
   ===================================================================== */
const app = document.getElementById('app');
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => (n < 0 ? '−' : '') + 'R$ ' + Math.abs(Math.round(n)).toLocaleString('pt-BR');
const brlK = n => { const a = Math.abs(n); const s = a >= 1e6 ? (a/1e6).toFixed(2).replace('.', ',') + ' mi' : a >= 1e4 ? Math.round(a/1000) + ' mil' : a >= 1000 ? (a/1000).toFixed(1).replace('.', ',') + ' mil' : Math.round(a); return (n < 0 ? '−' : '') + 'R$ ' + s; };
const pct = v => (v * 100).toFixed(0) + '%';
const cls = n => n < 0 ? 'bad' : 'good';
const rnd = n => Math.random().toString(36).slice(2, 2 + n);
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const baseUrl = () => location.origin + location.pathname;
const pisoOf = (mp, conv) => (mp + conv) / (1 - G.varPct);
function toast(html, ms, cl){
  const t = document.createElement('div'); t.className = 'toast ' + (cl || ''); t.innerHTML = html;
  $('toasts').appendChild(t); setTimeout(() => t.remove(), ms || 3500);
  const all = $('toasts').children; if (all.length > 3) all[0].remove();
}
function confetti(){
  const em = ['🎉','✨','🏆','💰','🎊'];
  for (let i = 0; i < 40; i++){
    const s = document.createElement('span'); s.className = 'confetti'; s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDuration = (2.5 + Math.random() * 2.5) + 's'; s.style.animationDelay = Math.random() * 1.5 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 7000);
  }
}
function loadScript(src){return new Promise((ok, no) => {const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s);});}
async function loadLibs(){
  if (!window.Peer) for (const u of ["https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js","https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"]) { try { await loadScript(u); if (window.Peer) break; } catch(e){} }
  if (!window.QRCode) for (const u of ["https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js","https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"]) { try { await loadScript(u); if (window.QRCode) break; } catch(e){} }
}
function blockedMsg(){
  app.innerHTML = `<div class="card stack" style="max-width:640px;margin:40px auto">
    <h2>Não consegui conectar</h2>
    <p>Este navegador ou esta rede bloqueou a conexão do jogo (acontece em pré-visualizações de apps ou em redes que bloqueiam conexões diretas).</p>
    <p class="mute">Abra o endereço do jogo no Chrome, Edge ou Safari. Se a rede bloquear, use o 4G.</p>
    <button class="btn" onclick="location.reload()">Tentar de novo</button></div>`;
}

/* =====================================================================
   SIMULAÇÃO DA EMPRESA (roda no celular de cada jogador)
   ===================================================================== */
let S = null;
function newState(){
  return {cash:G.startCash, raw:G.startRaw, fg:G.startFG, price:G.pref, prod:60, cap:G.capStart, eng:0, trucks:1, debt:0, rep:1,
    auto:true, lot:50, conv:G.convCost, cert:false, assets:0,
    orders:[], inbound:[], receivables:[], broken:0, strike:0, fair:0, demo:0, comp:0,
    gc:-1, prodAcc:0, demAcc:0, lostWhy:'', lastProd:0,
    m:newMonth(), hist:[], sold:0, lost:0, recTot:0,
    nextEv:3, ev:null, evDeadline:0, deck:[], done:false, avg:null};
}
function newMonth(){ return {rec:0, ded:0, cpv:0, fixed:0, jur:0, evc:0, extra:0, sold:0, lost:0}; }
const curMonth = () => Math.max(0, Math.min(G.months - 1, Math.floor(Math.max(0, S.gc) / G.cycles)));
function equity(){
  const mp = macroAt(curMonth()).mp;
  return S.cash - S.debt + (S.raw * mp + S.inbound.reduce((a, b) => a + b.qty * b.cost, 0) + S.fg * (mp + S.conv)) * STOCK_VALUE + S.assets;
}
const result = () => equity() - INIT;

function monthlyDemand(){
  const mac = macroAt(curMonth());
  const ref = G.pref + mac.shift;
  const pm = S.avg || S.price;
  const anchor = 0.5 * pm + 0.5 * ref;
  const v = 1 + 0.2 * S.eng * mac.val + (S.fair > 0 ? 0.25 : 0) + (S.cert ? 0.15 * mac.val : 0) + (S.demo > 0 ? 0.15 : 0);
  let d = G.baseDemand * mac.dem * S.rep * v * Math.exp(-mac.beta * (S.price - anchor) / G.pref);
  if (S.comp > 0) d *= 0.85;
  return Math.max(0, Math.min(250, d));
}

function buyRaw(qty, unit, delay){
  S.cash -= qty * unit;
  S.inbound.push({qty, cost:unit, at:S.gc + delay});
  FX.drive('🚛', route(edge('sup'), B.arm), Math.min(9000, delay * CYCLE_MS * 0.9));
}
function sell(q, p, cli){
  const mac = macroAt(curMonth());
  const rev = q * p;
  S.cash += rev * (1 - G.varPct);
  S.m.rec += rev; S.m.ded += rev * G.varPct; S.m.cpv += q * (mac.mp + S.conv);
  S.sold += q; S.m.sold += q; S.recTot += rev;
  const c = B[cli] || B.c2;
  FX.drive('🚚', route(B.fab, c), 2600, () => FX.float(c.x, c.y - 22, '+' + brlK(rev * (1 - G.varPct)), '#1b5e20'));
}
function spend(v){ S.cash -= v; S.m.evc += v; }
function gain(v){ S.cash += v; S.m.extra += v; }

function cycle(){
  S.gc++;
  const gc = S.gc, month = curMonth(), mac = macroAt(month);
  // chegada de matéria-prima
  S.inbound = S.inbound.filter(b => { if (b.at <= gc){ S.raw += b.qty; FX.float(B.arm.x, B.arm.y - 24, '+' + b.qty + ' MP', '#0d47a1'); return false; } return true; });
  // recebíveis de eventos
  S.receivables = S.receivables.filter(r => {
    if (r.at <= gc){
      if (Math.random() < r.p){ gain(r.v); toast(`💳 ${esc(r.who)} pagou ${brl(r.v)}!`); FX.float(B.ban.x, B.ban.y - 24, '+' + brlK(r.v), '#1b5e20'); }
      else toast(`😞 Calote: ${esc(r.who)} não pagou os ${brl(r.v)}.`, 5000);
      return false;
    } return true;
  });
  // compra automática
  const need = Math.min(S.prod, S.cap) / G.cycles * 4;
  const pipe = S.raw + S.inbound.reduce((a, b) => a + b.qty, 0);
  if (S.auto && S.prod > 0 && pipe < need) buyRaw(S.lot, mac.mp, 2);
  // produção
  const capNow = S.cap * (S.broken > 0 ? 0.5 : 1);
  S.prodAcc += Math.min(S.prod, capNow) / G.cycles;
  let n = Math.floor(S.prodAcc);
  if (n > S.raw){ n = S.raw; S.prodAcc = Math.min(S.prodAcc - n, 1); } else S.prodAcc -= n;
  S.raw -= n; S.fg += n; S.cash -= n * S.conv; S.lastProd = n;
  if (n > 0) FX.puff();
  if (S.broken > 0) S.broken--;
  // pedidos dos clientes
  S.demAcc += monthlyDemand() / G.cycles;
  while (S.demAcc >= 1){
    const q = Math.min(Math.floor(S.demAcc), ri(2, 6));
    S.demAcc -= q;
    S.orders.push({q, c:CLIENTS[ri(0, CLIENTS.length - 1)], ttl:2});
  }
  // entregas (cada caminhão faz 2 viagens por ciclo)
  let trips = S.strike > 0 ? 0 : S.trucks * 2;
  if (S.strike > 0) S.strike--;
  const keep = [];
  for (const o of S.orders){
    if (trips > 0 && S.fg >= o.q){ trips--; S.fg -= o.q; sell(o.q, S.price, o.c); }
    else {
      o.ttl--;
      if (o.ttl < 0){
        S.lost += o.q; S.m.lost += o.q; S.rep = Math.max(0.6, S.rep - 0.015);
        S.lostWhy = (trips <= 0 && S.fg >= o.q) ? 'truck' : 'stock';
        FX.float(B[o.c].x, B[o.c].y - 22, '😠 −' + o.q, '#b71c1c');
      } else keep.push(o);
    }
  }
  S.orders = keep;
  if (S.comp > 0) S.comp--;
  if (S.demo > 0) S.demo--;
  // fechamento do mês
  if (gc % G.cycles === G.cycles - 1) closeMonth(month, mac);
  // eventos
  if (!S.ev && gc >= S.nextEv && gc < G.months * G.cycles - 2) spawnEvent();
  if (gc >= G.months * G.cycles - 1) finishGame();
}

function closeMonth(month, mac){
  const fixed = G.admin + S.eng * G.engCost + S.trucks * G.truckCost;
  const jur = S.debt * mac.rate + (S.cash < 0 ? -S.cash * G.overdraft : 0);
  S.cash -= fixed + jur;
  const m = S.m; m.fixed = fixed; m.jur = jur;
  m.lucro = m.rec - m.ded - m.cpv - m.fixed - m.jur - m.evc + m.extra;
  m.month = month;
  S.hist.push(m);
  if (m.lost === 0) S.rep = Math.min(1.3, S.rep + 0.03);
  if (S.fair > 0) S.fair--;
  S.lostWhy = '';
  S.m = newMonth();
  toast(`<b>📅 Mês ${month + 1} fechado</b>
    <div class="wf"><span>Receita (${m.sold} sensores)</span><b>${brl(m.rec)}</b></div>
    <div class="wf"><span>(−) Tributos e despesas 18%</span><b class="bad">${brl(-m.ded)}</b></div>
    <div class="wf"><span>(−) Custo dos produtos vendidos</span><b class="bad">${brl(-m.cpv)}</b></div>
    <div class="wf"><span>(−) Despesas fixas</span><b class="bad">${brl(-m.fixed)}</b></div>
    ${m.jur ? `<div class="wf"><span>(−) Juros</span><b class="bad">${brl(-m.jur)}</b></div>` : ''}
    ${m.evc || m.extra ? `<div class="wf"><span>(±) Decisões e eventos</span><b>${brl(m.extra - m.evc)}</b></div>` : ''}
    <div class="wf" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span><b>= Lucro do mês</b></span><b class="${cls(m.lucro)}">${brl(m.lucro)}</b></div>
    ${m.lost ? `<p class="note">😠 ${m.lost} sensores em pedidos perdidos</p>` : ''}`, 6000, 'rep');
}

function bigSale(q, p, cli, msg){
  const n = Math.min(q, S.fg);
  if (n < q){ S.rep = Math.max(0.6, S.rep - 0.05); toast(`😕 Só havia ${n} sensores prontos: cliente insatisfeito.`); }
  if (n > 0){ S.fg -= n; sell(n, p, cli); }
  if (msg) toast(msg);
}
function buyTruck(){ S.cash -= G.truckPrice; S.assets += G.truckPrice / 2; S.trucks++; toast('🚚 Novo caminhão na garagem!'); }
function sellTruck(){ if (S.trucks <= 1) return; S.cash += G.truckPrice / 2; S.assets = Math.max(0, S.assets - G.truckPrice / 2); S.trucks--; }
function expand(){ S.cash -= G.capUpCost; S.assets += G.capUpCost / 2; S.cap += G.capUp; toast(`🏗️ Fábrica ampliada: ${S.cap} sensores/mês`); }

function spawnEvent(){
  if (!S.deck.length) S.deck = EVENTS.map((e, i) => i).sort(() => Math.random() - 0.5);
  let ev = null;
  while (S.deck.length && !ev){ const e = EVENTS[S.deck.shift()]; if (!e.cond || e.cond()) ev = e; }
  if (!ev) return;
  S.ev = ev; S.evDeadline = Date.now() + 30000;
  FX.drive(ev.who, route(edge(ev.at), B[ev.at]), 2500);
  UI.dirty = true;
}
function resolveEvent(i, auto){
  const ev = S.ev; if (!ev) return;
  const o = ev.opts[i];
  S.ev = null; S.nextEv = S.gc + ri(5, 7);
  o.f();
  if (auto) toast(`⏱ Sem resposta para ${ev.who} ${esc(ev.name)}: "${esc(o.t)}".`);
  UI.closeSheet(); UI.dirty = true;
}
function finishGame(){
  if (S.done) return; S.done = true;
  P.sendStat();
  UI.showEnd();
}

function edge(k){ const b = B[k]; return {x: b.x < 180 ? -14 : 374, y: AV}; }
function route(a, b){ return [{x:a.x, y:a.y}, {x:a.x, y:AV}, {x:b.x, y:AV}, {x:b.x, y:b.y}]; }
const FX = {
  movers: [],
  layer(){ return $('fx'); },
  drive(emoji, pts, dur, done){
    const L = this.layer(); if (!L) { if (done) done(); return; }
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.textContent = emoji; t.setAttribute('font-size', '20'); t.setAttribute('text-anchor', 'middle'); t.setAttribute('dominant-baseline', 'central');
    L.appendChild(t);
    const seg = []; let tot = 0;
    for (let i = 1; i < pts.length; i++){ const d = Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y); seg.push(d); tot += d; }
    this.movers.push({el:t, pts, seg, tot, t0:performance.now(), dur, done});
    this.run();
  },
  float(x, y, txt, col){
    const L = this.layer(); if (!L) return;
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.textContent = txt; t.setAttribute('x', x); t.setAttribute('y', y); t.setAttribute('text-anchor', 'middle');
    t.setAttribute('font-size', '11'); t.setAttribute('font-weight', '800'); t.setAttribute('fill', col || '#14213d');
    t.setAttribute('stroke', '#fff'); t.setAttribute('stroke-width', '3'); t.setAttribute('paint-order', 'stroke');
    L.appendChild(t);
    this.movers.push({el:t, float:true, x, y, t0:performance.now(), dur:1600});
    this.run();
  },
  puff(){
    if (Math.random() < 0.5) return;
    this.float(B.fab.x + 14, B.fab.y - 30, '💨', '#555');
  },
  running:false,
  run(){
    if (this.running) return; this.running = true;
    const step = now => {
      this.movers = this.movers.filter(m => {
        const k = Math.min(1, (now - m.t0) / m.dur);
        if (m.float){
          m.el.setAttribute('y', m.y - 26 * k); m.el.setAttribute('opacity', String(1 - k * k));
        } else {
          let d = k * m.tot, i = 0;
          while (i < m.seg.length - 1 && d > m.seg[i]){ d -= m.seg[i]; i++; }
          const a = m.pts[i], b = m.pts[i + 1], r = m.seg[i] ? d / m.seg[i] : 1;
          const x = a.x + (b.x - a.x) * r, y = a.y + (b.y - a.y) * r;
          m.el.setAttribute('x', x); m.el.setAttribute('y', y - 6);
          m.el.setAttribute('transform', b.x > a.x ? `scale(-1,1) translate(${-2 * x},0)` : '');
        }
        if (k >= 1){ m.el.remove(); if (m.done) m.done(); return false; }
        return true;
      });
      if (this.movers.length) requestAnimationFrame(step); else this.running = false;
    };
    requestAnimationFrame(step);
  }
};

function mapSVG(name){
  const road = (d, w) => `<path d="${d}" stroke="#5f6670" stroke-width="${w || 14}" fill="none" stroke-linecap="round"/>`;
  let roads = road(`M-10 ${AV} H370`, 18) + `<path d="M-10 ${AV} H370" stroke="#f5d547" stroke-width="1.5" stroke-dasharray="7 7" fill="none"/>`;
  for (const k in B){ roads += road(`M${B[k].x} ${B[k].y} V${AV}`, 10); }
  let trees = TREES.map(([x, y]) => `<text x="${x}" y="${y}" font-size="16" text-anchor="middle">🌳</text>`).join('');
  let blds = '';
  for (const k in B){
    const b = B[k], r = b.big ? 30 : 23, fs = b.big ? 38 : 28;
    const label = k === 'fab' ? name : b.n;
    const w = Math.max(44, label.length * 5.6 + 10);
    blds += `<g class="bld" data-k="${k}">
      <circle class="halo" cx="${b.x}" cy="${b.y}" r="${r}" fill="${b.big ? 'rgba(255,214,110,.75)' : 'rgba(255,255,255,.35)'}" stroke="${b.big ? '#e07a2c' : 'rgba(255,255,255,.7)'}" stroke-width="2"/>
      <text x="${b.x}" y="${b.y + 1}" font-size="${fs}" text-anchor="middle" dominant-baseline="central">${b.ic}</text>
      <rect x="${b.x - w / 2}" y="${b.y + r - 4}" width="${w}" height="13" rx="6" fill="rgba(255,255,255,.9)"/>
      <text class="lbl" x="${b.x}" y="${b.y + r + 6}" text-anchor="middle">${esc(label)}</text>
      <text id="bd-${k}" x="${b.x + r - 2}" y="${b.y - r + 6}" font-size="13" font-weight="800" text-anchor="middle"></text>
    </g>`;
  }
  return `<svg id="map" viewBox="0 0 360 310" xmlns="http://www.w3.org/2000/svg">
    <rect width="360" height="310" fill="#7cb342"/>
    <rect width="360" height="310" fill="url(#gr)" opacity=".25"/>
    <defs><pattern id="gr" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.2" fill="#33691e"/></pattern></defs>
    <ellipse cx="300" cy="182" rx="22" ry="9" fill="#4fc3f7" opacity=".85"/>
    ${roads}${trees}${blds}<g id="fx"></g></svg>`;
}

  sheetAct(x){
    if (x === 'close') return this.closeSheet();
    if (!S || S.done) return;
    const mac = macroAt(curMonth());
    if (x === 'p-' || x === 'p+' || x === 'q-' || x === 'q+') return this.act(x);
    if (x === 'exp') expand();
    if (x === 'auto1') S.auto = true;
    if (x === 'auto0') S.auto = false;
    if (x.startsWith('buy')){ const q = Number(x.slice(3)); buyRaw(q, mac.mp, 2); toast(`🚛 ${q} unidades de matéria-prima a caminho`); }
    if (x.startsWith('lot')) S.lot = Number(x.slice(3));
    if (x === 'eng+'){ S.eng++; toast('🧑‍💼 Engenheiro de vendas contratado!'); }
    if (x === 'eng-' && S.eng > 0) S.eng--;
    if (x === 'truck+') buyTruck();
    if (x === 'truck-') sellTruck();
    if (x === 'loan+'){ S.debt += 20000; S.cash += 20000; }
    if (x === 'loan-' && S.debt >= 20000 && S.cash >= 20000){ S.debt -= 20000; S.cash -= 20000; }
    this.fillSheet(); this.render();
  },
  showEnd(){
    clearInterval(this.timer); this.closeSheet();
    const tot = S.hist.reduce((a, m) => a + m.rec, 0);

};

const P = {code:null, pid:null, name:'', peer:null, conn:null, tries:0, t0:null, rank:null, n:null, statT:null, loopT:null, final:null};
P.elapsed = () => P.t0 == null ? 0 : Date.now() - P.t0;
P.sendStat = () => {
  if (!S || !P.conn || !P.conn.open) return;
  try { P.conn.send({type:'stat', price:S.price, res:Math.round(result()), cash:Math.round(S.cash), sold:S.sold, lost:S.lost, rep:S.rep, done:S.done}); } catch(e){}
};
function startPlayer(code){
  P.code = code.toUpperCase();
  P.pid = store.get('mj2_pid') || ('p-' + rnd(10)); store.set('mj2_pid', P.pid);
  const saved = store.get('mj2_name') || '';
  app.innerHTML = `
  <div class="phone stack" style="margin-top:20px">
    <p class="kick">Mercado em Jogo · Sala ${esc(P.code)}</p>
    <h2 style="font-size:30px">🏭 Dê um nome à sua empresa</h2>
    <form id="f" class="stack">
      <input type="text" id="nm" maxlength="18" placeholder="Ex.: Sensores do João" value="${esc(saved)}" autocomplete="off">
      <button class="btn big" type="submit">Entrar na cidade</button>
    </form>
    <p class="mute">Você vai administrar uma fábrica de sensores industriais por 12 meses. Vence quem terminar com mais lucro.</p>
  </div>`;
  $('f').onsubmit = e => {
    e.preventDefault();
    const n = $('nm').value.trim(); if (!n) { $('nm').focus(); return; }
    P.name = n.slice(0, 18); store.set('mj2_name', P.name);
    playerWait('Conectando à cidade…'); connect();
  };
}
function connect(){
  if (!window.Peer){ playerWait('Não foi possível carregar a conexão. Verifique a internet e recarregue.'); return; }
  try { if (P.peer) P.peer.destroy(); } catch(e){}
  try { P.peer = new Peer(); } catch(e){ blockedMsg(); return; }
  P.peer.on('open', () => {
    const c = P.peer.connect('mercado-cidade-' + P.code.toLowerCase(), {reliable:true});
    P.conn = c;
    c.on('open', () => { P.tries = 0; c.send({type:'join', pid:P.pid, name:P.name}); });
    c.on('data', playerData);
    c.on('close', () => { if (P.conn === c) retry(); });
  });
  P.peer.on('error', e => {
    if (e.type === 'peer-unavailable'){ if (!S) playerWait('Cidade não encontrada. Confira o código ou peça para o apresentador abrir a sala. Tentando de novo…'); setTimeout(connect, 4000); }
    else retry();
  });
}
function retry(){
  P.tries++;
  if (S && !S.done) toast('📡 Conexão com o telão caiu. Reconectando… (seu jogo continua)');
  else if (!S) playerWait('Conexão perdida. Reconectando…');
  setTimeout(connect, Math.min(8000, 1500 * P.tries));
}
function playerWait(html){
  app.innerHTML = `<div class="phone stack" style="margin-top:20px"><p class="kick">Mercado em Jogo · Sala ${esc(P.code || '')}</p><div class="card"><p style="font-size:19px">${html}</p></div></div>`;
}
function renderLobby(){
  app.innerHTML = `<div class="phone stack" style="margin-top:16px">
    <p class="kick">Mercado em Jogo · Sala ${esc(P.code)}</p>
    <div class="card stack center"><p style="font-size:44px">🏭</p><h2>${esc(P.name)} chegou à cidade!</h2><p class="mute">Aguarde o apresentador começar.</p></div>
    <div class="card stack">
      <div class="badge"><span class="ic">🏷️</span><div><b>Preço e produção</b><br><span class="mute">Ficam sempre na tela, embaixo do mapa.</span></div></div>
      <div class="badge"><span class="ic">🗺️</span><div><b>Toque nos prédios</b><br><span class="mute">Armazém, garagem, comercial e banco têm decisões próprias.</span></div></div>
      <div class="badge"><span class="ic">❗</span><div><b>Eventos chegam pelo mapa</b><br><span class="mute">Fornecedores, clientes e problemas aparecem durante o jogo.</span></div></div>
      <div class="badge"><span class="ic">💰</span><div><b>12 meses, cerca de 10 minutos</b><br><span class="mute">Vence o maior lucro acumulado da sala.</span></div></div>
    </div></div>`;
}
function playerData(d){
  if (!d || typeof d !== 'object') return;
  if (d.type === 'lobby'){ if (!S) renderLobby(); }
  else if (d.type === 'start' || d.type === 'tick'){
    const el = Number(d.el) || 0;
    if (P.t0 == null || Math.abs(P.elapsed() - el) > 1500) P.t0 = Date.now() - el;
    if (d.avg) { if (S) S.avg = d.avg; P.avg = d.avg; }
    if (d.rank){ P.rank = d.rank; P.n = d.n; }
    if (!S && el < TOTAL_MS) beginGame(el);
  }
  else if (d.type === 'end') showFinal(d);
  else if (d.type === 'closed') playerWait('O jogo desta sala já terminou.');
}
function beginGame(el){
  S = newState(); S.avg = P.avg || null;
  S.gc = Math.floor(el / CYCLE_MS) - 1;
  if (S.gc >= 0) S.nextEv = S.gc + 3;
  UI.build();
  toast('🏁 O jogo começou! Toque em ❓ Como jogar se precisar.', 4500);
  clearInterval(P.loopT);
  P.loopT = setInterval(() => {
    if (!S || S.done) return;
    const target = Math.min(G.months * G.cycles, Math.floor(P.elapsed() / CYCLE_MS));
    let guard = 0;
    while (S.gc < target - 1 && guard++ < 200 && !S.done){ cycle(); UI.dirty = true; }
  }, 250);
  clearInterval(P.statT); P.statT = setInterval(P.sendStat, 3000);
}
function showFinal(d){
  P.final = d;
  if (S && !S.done) finishGame();
  if (!S){ playerWait('O jogo terminou.'); return; }
  const w = $('endWait'), f = $('endFinal'); if (!f) return;
  if (w) w.remove();
  const medal = ['🥇', '🥈', '🥉'][d.pos - 1] || '🏅';
  f.innerHTML = `<div class="card stack">
    <p style="font-size:60px">${medal}</p><h2>${d.pos}º lugar de ${d.n}</h2>
    ${(d.awards || []).map(a => `<div class="badge" style="text-align:left"><span class="ic">${a.ic}</span><div><b>${esc(a.t)}</b><br><span class="note">${esc(a.s)}</span></div></div>`).join('')}
    <div style="text-align:left">${d.podium.map((p, i) => `<p style="font-size:17px">${['🥇','🥈','🥉'][i]} <b>${esc(p.name)}</b> · ${brl(p.res)}</p>`).join('')}</div>
  </div><p class="mute">Obrigado por jogar! 👏</p>`;
  if (d.pos <= 3) confetti();
}

const H = {code:null, peer:null, players:{}, phase:'lobby', t0:0, timer:null, news:[]};
const hostPlayers = () => Object.values(H.players);
const hostEl = () => H.phase === 'run' ? Date.now() - H.t0 : 0;
function sendTo(p, msg){ if (p.conn && p.conn.open){ try { p.conn.send(msg); } catch(e){} } }
function ranking(){ return hostPlayers().slice().sort((a, b) => (b.st ? b.st.res : -1e12) - (a.st ? a.st.res : -1e12)); }
function avgPrice(){ const ps = hostPlayers().filter(p => p.st); return ps.length ? ps.reduce((a, p) => a + p.st.price, 0) / ps.length : null; }

function startHost(){
  if (!window.Peer){ blockedMsg(); return; }
  H.code = rnd(4).toUpperCase();
  app.innerHTML = `<div class="card"><p>Abrindo a cidade…</p></div>`;
  try { H.peer = new Peer('mercado-cidade-' + H.code.toLowerCase()); } catch(e){ blockedMsg(); return; }
  const my = H.peer;
  setTimeout(() => { if (H.peer === my && !my.open && H.phase === 'lobby') blockedMsg(); }, 12000);
  H.peer.on('open', () => renderHostLobby());
  H.peer.on('connection', conn => {
    conn.on('data', d => hostData(conn, d));
    conn.on('close', () => { const p = H.players[conn._pid]; if (p && p.conn === conn){ p.online = false; if (H.phase === 'lobby') renderHostLobby(); } });
  });
  H.peer.on('disconnected', () => { try { H.peer.reconnect(); } catch(e){} });
  H.peer.on('error', e => { if (e.type === 'unavailable-id'){ H.peer.destroy(); startHost(); } });
}
function hostData(conn, d){
  if (!d || typeof d !== 'object') return;
  if (d.type === 'join'){
    const pid = String(d.pid || '').slice(0, 40); if (!pid) return;
    let p = H.players[pid];
    if (!p){
      if (H.phase === 'final'){ try { conn.send({type:'closed'}); } catch(e){} return; }
      p = H.players[pid] = {pid, name:String(d.name || '').trim().slice(0, 18) || 'Empresa', st:null};
    }
    p.conn = conn; p.online = true; conn._pid = pid;
    if (H.phase === 'lobby'){ sendTo(p, {type:'lobby'}); renderHostLobby(); }
    else if (H.phase === 'run') sendTo(p, {type:'start', el:hostEl(), avg:avgPrice()});
    else if (H.phase === 'final') sendFinal(p);
  } else if (d.type === 'stat'){
    const p = H.players[conn._pid]; if (!p) return;
    const n = x => Number.isFinite(Number(x)) ? Number(x) : 0;
    p.st = {price:Math.min(5000, Math.max(0, n(d.price))), res:n(d.res), cash:n(d.cash), sold:n(d.sold), lost:n(d.lost), rep:n(d.rep), done:!!d.done};
  }
}
function addBots(){
  ['Robô Alfa', 'Robô Beta', 'Robô Gama'].forEach(n => {
    const pid = 'bot-' + rnd(6);
    H.players[pid] = {pid, name:n, bot:true, online:true, st:{price:ri(13, 18) * 100, res:0, cash:G.startCash, sold:0, lost:0, rep:1}};
  });
  renderHostLobby();
}
function hostStart(){
  if (!hostPlayers().length) return;
  H.phase = 'run'; H.t0 = Date.now(); H.lastMacro = -1;
  hostPlayers().forEach(p => sendTo(p, {type:'start', el:0, avg:avgPrice()}));
  renderHostRun();
  clearInterval(H.timer);
  H.timer = setInterval(hostTick, 1000);
}
function hostTick(){
  const el = hostEl();
  // robôs
  hostPlayers().forEach(p => { if (p.bot){ p.st.res += ri(-3000, 9000); p.st.sold += ri(3, 8); p.st.price = Math.max(1100, Math.min(2100, p.st.price + ri(-1, 1) * 50)); } });
  const rk = ranking(), avg = avgPrice();
  rk.forEach((p, i) => sendTo(p, {type:'tick', el, avg, rank:i + 1, n:rk.length}));
  if (el >= TOTAL_MS + 2500){ hostEnd(); return; }
  renderHostRun();
}
function hostEnd(){
  clearInterval(H.timer); H.phase = 'final';
  hostPlayers().forEach(sendFinal);
  renderPodium();
}
function awardsList(){
  const ps = hostPlayers().filter(p => p.st); if (!ps.length) return [];
  const top = f => ps.slice().sort((a, b) => f(b) - f(a))[0];
  const a = [];
  const r = top(p => p.st.res); a.push({pid:r.pid, ic:'💰', t:'Maior lucro', s:brl(r.st.res)});
  const v = top(p => p.st.sold); a.push({pid:v.pid, ic:'🚚', t:'Rei das entregas', s:v.st.sold + ' sensores vendidos'});
  const q = top(p => p.st.rep * 1000 - p.st.lost); a.push({pid:q.pid, ic:'⭐', t:'Clientes mais satisfeitos', s:'reputação ' + Math.min(100, Math.round(q.st.rep * 100)) + '%'});
  const pr = ps.filter(p => p.st.res > 0); if (pr.length){ const m = pr.slice().sort((x, y) => y.st.price - x.st.price)[0]; a.push({pid:m.pid, ic:'💎', t:'Preço premium com lucro', s:brl(m.st.price) + ' por sensor'}); }
  return a;
}
function sendFinal(p){
  const rk = ranking(), aw = awardsList();
  sendTo(p, {type:'end', pos:rk.indexOf(p) + 1, n:rk.length, podium:rk.slice(0, 3).map(x => ({name:x.name, res:x.st ? x.st.res : 0})), awards:aw.filter(a => a.pid === p.pid).map(a => ({ic:a.ic, t:a.t, s:a.s}))});
}

function renderHostLobby(){
  const link = baseUrl() + '?sala=' + H.code;
  const ps = hostPlayers();
  app.innerHTML = `
  <div class="host stack">
    <p class="kick">Mercado em Jogo · Cidade ${esc(H.code)}</p>
    <h1>Cada um administra a própria fábrica. Quem lucra mais em 12 meses?</h1>
    ${location.protocol === 'file:' ? `<p class="warnbox">Arquivo aberto direto do computador: publique-o na internet para os celulares entrarem.</p>` : ''}
    <div class="row">
      <div class="card stack center" style="min-width:300px;align-items:center">
        <p class="kick">Aponte a câmera do celular</p><div id="qr"></div>
        <p class="note" style="word-break:break-all">${esc(link)}</p>
        <p>Código: <b style="font-size:30px;letter-spacing:4px">${esc(H.code)}</b></p>
      </div>
      <div class="card stack grow">
        <div class="row">
          <div class="deep grow center"><p style="font-size:30px">🗺️</p><b>Uma cidade, várias fábricas</b><p class="note">Fornecedor, clientes, banco e caminhões no mapa</p></div>
          <div class="deep grow center"><p style="font-size:30px">❗</p><b>Eventos o tempo todo</b><p class="note">Ofertas, greves, quebras, clientes grandes</p></div>
          <div class="deep grow center"><p style="font-size:30px">⏱️</p><b>12 meses = 10 minutos</b><p class="note">Vence o maior lucro acumulado</p></div>
        </div>
        <h3>Empresas na cidade (${ps.length})</h3>
        <div>${ps.map(p => `<span class="chip ${p.online ? 'ok' : ''}">${p.bot ? '🤖' : '🏭'} ${esc(p.name)}</span>`).join('') || '<span class="mute">Aguardando jogadores…</span>'}</div>
        <div class="row"><button class="btn big" id="go" ${ps.length ? '' : 'disabled'}>▶ Começar o jogo</button><button class="btn ghost" id="bots">+ 3 robôs (teste)</button></div>
      </div>
    </div>
  </div>`;
  $('go').onclick = hostStart; $('bots').onclick = addBots;
  const q = $('qr');
  if (window.QRCode){ try { new QRCode(q, {text:link, width:250, height:250, correctLevel:QRCode.CorrectLevel.M}); } catch(e){ q.style.display = 'none'; } } else q.style.display = 'none';
}
function renderHostRun(){
  const el = hostEl(), month = Math.min(G.months - 1, Math.floor(el / G.monthMs)), mac = macroAt(month);
  const left = Math.max(0, TOTAL_MS - el), rk = ranking(), avg = avgPrice();
  if (H.lastMacro !== mac.m){ H.lastMacro = mac.m; }
  const lots = hostPlayers().map(p => {
    const s = p.st || {res:0, price:G.pref, sold:0, rep:1};
    return `<div class="lot ${s.res < 0 ? 'neg' : ''}"><div class="bi">${p.bot ? '🤖' : '🏭'}</div><div class="nm">${esc(p.name)}</div><div class="val">${brlK(s.res)}</div><div class="sub">🏷️ ${brl(s.price)} · 🚚 ${s.sold} · ⭐ ${Math.min(100, Math.round(s.rep * 100))}%</div></div>`;
  }).join('');
  app.innerHTML = `
  <div class="host stack">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div><p class="kick">Cidade ${esc(H.code)}</p><h1>Mês ${month + 1} de ${G.months}</h1></div>
      <div class="center"><p class="big-num">⏱ ${Math.floor(left / 60000)}:${String(Math.floor(left / 1000) % 60).padStart(2, '0')}</p><p class="mute">preço médio da cidade: ${avg ? brl(avg) : '—'}</p></div>
    </div>
    <div class="tbar" style="height:10px"><i style="width:${Math.min(100, 100 * el / TOTAL_MS)}%"></i></div>
    <div class="news"><span class="ic">${mac.ic}</span><div><p class="kick">Notícia da cidade</p><h2>${esc(mac.t)}</h2><p class="mute" style="font-size:18px">${esc(mac.d)}</p></div></div>
    <div class="row" style="align-items:flex-start">
      <div class="card grow" style="flex:2"><h3 style="margin-bottom:10px">🗺️ Fábricas da cidade</h3><div class="lots">${lots}</div></div>
      <div class="card grow" style="flex:1"><h3>🏆 Ranking ao vivo</h3><ol class="rank">${rk.slice(0, 10).map((p, i) => `<li><span>${['🥇','🥈','🥉'][i] || (i + 1) + 'º'} ${esc(p.name)}</span><b class="${cls(p.st ? p.st.res : 0)}">${brlK(p.st ? p.st.res : 0)}</b></li>`).join('')}</ol>
        <button class="btn ghost" style="margin-top:12px;width:100%" id="endNow">Encerrar agora</button></div>
    </div>
  </div>`;
  $('endNow').onclick = () => { if (confirmEnd()) hostEnd(); };
}
function confirmEnd(){ H.endClicks = (H.endClicks || 0) + 1; if (H.endClicks < 2){ toast('Clique de novo em "Encerrar agora" para confirmar.'); setTimeout(() => H.endClicks = 0, 3000); return false; } return true; }
function renderPodium(){
  const rk = ranking(), aw = awardsList();
  const col = [{bg:'#c0c7d4', h:230, i:1}, {bg:'#f0a35e', h:300, i:0}, {bg:'#b07a4f', h:180, i:2}];
  app.innerHTML = `
  <div class="host stack center">
    <p class="kick">Pódio final</p><h1>As empresas que melhor administraram preço, custos e vendas</h1>
    <div class="podium">${col.map((c, k) => { const p = rk[c.i]; if (!p) return ''; return `<div class="stepP" style="background:${c.bg};height:${c.h}px;animation-delay:${[0.8, 1.6, 0][k]}s"><div class="pos">${c.i + 1}º</div><div class="nm">${esc(p.name)}</div><div>${brl(p.st ? p.st.res : 0)}</div></div>`; }).join('')}</div>
    <div class="row" style="justify-content:center">${aw.map(a => `<div class="badge" style="min-width:230px;text-align:left"><span class="ic">${a.ic}</span><div><b>${esc(a.t)}</b><br>${esc(H.players[a.pid].name)}<br><span class="note">${esc(a.s)}</span></div></div>`).join('')}</div>
    <div class="card" style="text-align:left"><ol class="rank">${rk.map((p, i) => `<li><span>${i + 1}º ${esc(p.name)}</span><span>${p.st ? '🏷️ ' + brl(p.st.price) + ' · 🚚 ' + p.st.sold + ' · ' : ''}<b class="${cls(p.st ? p.st.res : 0)}">${brl(p.st ? p.st.res : 0)}</b></span></li>`).join('')}</ol></div>
  </div>`;
  setTimeout(confetti, 1600);
}

function home(){
  app.innerHTML = `
  <div class="phone stack" style="margin-top:28px">
    <p class="kick">IFSP · Engenharia Econômica e Financeira</p>
    <h1 style="font-size:42px">🏭 Mercado em Jogo</h1>
    <p class="mute" style="font-size:17px">Administre uma fábrica de sensores numa cidade cheia de clientes, fornecedores e imprevistos.</p>
    <div class="card stack"><h3>📽️ Sou o apresentador</h3><p class="mute">Abra no computador ligado ao projetor.</p><button class="btn big" id="h">Abrir a cidade</button></div>
    <div class="card stack"><h3>📱 Vou jogar</h3>
      <form id="j" class="row"><input type="text" id="code" maxlength="6" placeholder="Código da sala" style="flex:1;min-width:150px;text-transform:uppercase"><button class="btn" type="submit">Entrar</button></form></div>
  </div>`;
  $('h').onclick = startHost;
  $('j').onsubmit = e => { e.preventDefault(); const c = $('code').value.trim().replace(/[^A-Za-z0-9]/g, ''); if (c){ history.replaceState(null, '', '?sala=' + c.toUpperCase()); startPlayer(c); } };
}
(async () => {
  await loadLibs();
  const sala = new URLSearchParams(location.search).get('sala');
  if (sala && /^[A-Za-z0-9]{2,8}$/.test(sala)) startPlayer(sala);
  else home();
})();
window.addEventListener('beforeunload', e => { if (H.peer && H.phase === 'run'){ e.preventDefault(); e.returnValue = ''; } });
